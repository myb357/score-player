name: Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify committed APK for Docker
        run: |
          APK_PATH="static/android/score-player.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Committed APK was not found at $APK_PATH."
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_PATH")
          if [ "$APK_SIZE" -lt 1500000 ]; then
            echo "Committed APK is unexpectedly small: ${APK_SIZE} bytes. Refusing to publish."
            exit 1
          fi
          mkdir -p score_app/static/android
          cp "$APK_PATH" score_app/static/android/score-player.apk
          ls -lh static/android/score-player.apk score_app/static/android/score-player.apk

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-rd0vl6t3c1p11agm.cn-beijing.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: score_app/Dockerfile
          push: true
          tags: |
            ghcr.io/myb357/score-player:latest
            crpi-rd0vl6t3c1p11agm.cn-beijing.personal.cr.aliyuncs.com/myb357/score-player:latest

      - name: Trigger soft-router deploy
        continue-on-error: true
        env:
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          curl --fail-with-body --show-error --silent --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"source":"github-actions","workflow":"docker-publish"}' \
            "https://webhook.scoreplayer-myb.top/deploy?token=${WEBHOOK_TOKEN}"

