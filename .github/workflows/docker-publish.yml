name: Build and Publish Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-rd0vl6t3c1p11agm.cn-beijing.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: score_app/Dockerfile
          push: true
          tags: |
            ghcr.io/myb357/score-player:latest
            crpi-rd0vl6t3c1p11agm.cn-beijing.personal.cr.aliyuncs.com/myb357/score-player:latest

      # 镜像推送完成后，通过 Cloudflare Tunnel 暴露的 Webhook 主动触发软路由部署。
      # 需要在仓库 Secrets 中配置 WEBHOOK_TOKEN（与软路由 .env 中的 WEBHOOK_TOKEN 一致）。
      - name: Trigger soft router deploy via Webhook
        run: |
          curl -f -X POST "https://webhook.scoreplayer-myb.top/deploy?token=${{ secrets.WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            --retry 3 --retry-delay 5 --max-time 60
