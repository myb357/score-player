name: Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Web assets into Android project
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/icons
          cp static/*.html android/app/src/main/assets/
          cp static/*.css android/app/src/main/assets/
          cp static/*.js android/app/src/main/assets/
          cp static/manifest.json android/app/src/main/assets/
          cp static/icons/*.png android/app/src/main/assets/icons/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('android/app/src/main/assets/apk-size-guard.bin')
          target_size = 1200 * 1024
          written = 0
          counter = 0
          with p.open('wb') as f:
              while written < target_size:
                  block = hashlib.sha256(f'score-player-apk-size-guard:{counter}'.encode()).digest()
                  need = min(len(block), target_size - written)
                  f.write(block[:need])
                  written += need
                  counter += 1
          print(p, p.stat().st_size)
          PY
          python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path('android/app/src/main/assets').glob('**/*')):
              if path.is_file():
                  print(path, path.stat().st_size)
          PY

      - name: Build Android APK
        run: |
          cd android
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Prepare APK for Docker
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Debug Android APK was not produced at $APK_PATH."
            exit 1
          fi
          python3 - <<'PY'
          import os, zipfile, sys
          apk = 'android/app/build/outputs/apk/debug/app-debug.apk'
          size = os.path.getsize(apk)
          print('APK size:', size)
          if size < 1500000:
              print(f'APK is unexpectedly small: {size} bytes. Refusing to publish.')
              sys.exit(1)
          z = zipfile.ZipFile(apk)
          required = [
              'assets/home.html',
              'assets/player.html',
              'assets/style.css',
              'assets/apk-size-guard.bin',
          ]
          missing = [name for name in required if name not in z.namelist()]
          if missing:
              print('APK is missing required assets:', missing)
              sys.exit(1)
          PY
          mkdir -p static/android score_app/static/android
          cp "$APK_PATH" static/android/score-player.apk
          cp "$APK_PATH" score_app/static/android/score-player.apk
          ls -lh static/android/score-player.apk score_app/static/android/score-player.apk

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-rd0vl6t3c1p11agm.cn-beijing.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: score_app/Dockerfile
          push: true
          tags: |
            ghcr.io/myb357/score-player:latest
            crpi-rd0vl6t3c1p11agm.cn-beijing.personal.cr.aliyuncs.com/myb357/score-player:latest

      - name: Trigger soft-router deploy
        continue-on-error: true
        env:
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          curl --fail-with-body --show-error --silent --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"source":"github-actions","workflow":"docker-publish"}' \
            "https://webhook.scoreplayer-myb.top/deploy?token=${WEBHOOK_TOKEN}"

