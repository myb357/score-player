name: Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          cd android
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease || ./gradlew assembleDebug
          else
            gradle assembleRelease || gradle assembleDebug
          fi

      - name: Prepare APK for Docker
        run: |
          APK_PATH=""
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            APK_PATH="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          else
            echo "No Android APK was produced."
            exit 1
          fi
          mkdir -p static/android score_app/static/android
          cp "$APK_PATH" static/android/score-player.apk
          cp "$APK_PATH" score_app/static/android/score-player.apk

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-rd0vl6t3c1p11agm.cn-beijing.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: score_app/Dockerfile
          push: true
          tags: |
            ghcr.io/myb357/score-player:latest
            crpi-rd0vl6t3c1p11agm.cn-beijing.personal.cr.aliyuncs.com/myb357/score-player:latest

      - name: Trigger soft-router deploy
        continue-on-error: true
        env:
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          curl --fail-with-body --show-error --silent --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"source":"github-actions","workflow":"docker-publish"}' \
            "https://webhook.scoreplayer-myb.top/deploy?token=${WEBHOOK_TOKEN}"

      - name: Trigger Render deploy
        run: |
          curl -f -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}' \
            --fail-with-body
