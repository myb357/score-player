# Render 部署配置（Blueprint）。在 Render 控制台选择 "New +" -> "Blueprint"，
# 关联包含本仓库的 Git 仓库即可自动按此文件创建服务。
#
# 数据已全部外置到 Supabase(PostgreSQL) + Backblaze B2(对象存储)，
# 因此服务本身无状态，free 套餐即可（休眠唤醒不会丢数据）。
# 标记 sync:false 的变量为“敏感项”，需在 Render 控制台 Environment 手动填入，不写入仓库。
services:
  - type: web
    name: score-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/ping
    envVars:
      # --- 运行时临时目录（仅存放 ffmpeg 转码临时文件，无需持久化） ---
      - key: SCORE_DATA_DIR
        value: /tmp/score_app_data

      # --- Supabase PostgreSQL 连接串（敏感，控制台填入） ---
      # 形如 postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false

      # --- Backblaze B2 (S3 兼容) 对象存储 ---
      - key: B2_KEY_ID          # keyID / Access Key（敏感）
        sync: false
      - key: B2_APP_KEY         # applicationKey / Secret Key（敏感）
        sync: false
      - key: B2_ENDPOINT        # 例：s3.ca-east-006.backblazeb2.com
        value: s3.ca-east-006.backblazeb2.com
      - key: B2_BUCKET          # 存储桶名
        value: score-player
      - key: B2_REGION          # 例：ca-east-006（留空则自动从 endpoint 解析）
        value: ca-east-006

      # --- 管理员登录（可选覆盖，默认见 main.py） ---
      # 如需自定义密码，请自行生成 PBKDF2 盐值与哈希后填入，二者需成对更新
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_SALT
        sync: false
      - key: ADMIN_HASH
        sync: false
