<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>播放</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    #pageImg { will-change: transform; transform-origin: center center; touch-action: none; }
    .stage { touch-action: none; cursor: grab; }
    .stage.grabbing { cursor: grabbing; }
    .player-root.pseudo-fs { position: fixed; inset: 0; z-index: 9999; width:100vw; height:100vh; }
  </style>
</head>
<body>
  <div class="player-root" id="root">
    <div class="player-body">
      <!-- LEFT: navigation -->
      <div class="side-bar left" id="leftBar">
        <a class="round-btn" href="/" title="返回">‹</a>
        <div class="bar-title" id="title">加载中</div>
        <div class="bar-spacer"></div>
        <button class="round-btn" id="prevBtn" title="上一页">⏮</button>
        <div class="page-ind-v" id="pageInd">1/1</div>
        <button class="round-btn" id="nextBtn" title="下一页">⏭</button>
        <div class="bar-spacer"></div>
        <button class="round-btn" id="exportBtn" title="导出谱子">⇩</button>
        <button class="round-btn" id="zoomReset" title="还原大小">⤢</button>
        <button class="round-btn" id="viewModeBtn" title="图片显示模式：适应屏幕" aria-label="切换图片显示模式">⛶</button>
        <button class="round-btn" id="fsBtn" title="全屏">⛶</button>
      </div>

      <!-- STAGE -->
      <div class="stage" id="stage">
        <img id="pageImg" alt="谱页" />
      </div>

      <!-- RIGHT: playback -->
      <div class="side-bar right" id="rightBar">
        <button class="play-btn" id="playBtn" title="播放/暂停">▶</button>
        <div class="vprogress-wrap" id="progressWrap">
          <span class="vtime" id="durTime">0:00</span>
          <div class="vprogress" id="progressBar">
            <div class="vprogress-ab" id="abFill" style="display:none;"></div>
            <div class="vprogress-played" id="played"></div>
            <div class="vmarker" id="markerA" style="display:none;"></div>
            <div class="vmarker" id="markerB" style="display:none;"></div>
          </div>
          <span class="vtime" id="curTime">0:00</span>
        </div>
        <div class="speed-v" id="speedGroup">
          <button class="round-btn sm" id="speedUp">＋</button>
          <span class="speed-val" id="speedVal">1.0x</span>
          <span class="lbl">倍速</span>
          <button class="round-btn sm" id="speedDown">−</button>
        </div>
        <div class="ab-v" id="abGroup">
          <span class="lbl">循环</span>
          <button class="round-btn sm" id="setA" title="设起点A">A</button>
          <button class="round-btn sm" id="setB" title="设终点B">B</button>
          <button class="round-btn sm" id="clearAB" title="取消循环">✕</button>
        </div>
        <div class="countdown-pill" id="cdPill" style="display:none;">倒计时 —</div>
      </div>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script>
    const scoreId = window.location.pathname.split('/').pop();
    const $ = id => document.getElementById(id);
    function toast(m,t){const w=$('toasts');const e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;w.appendChild(e);setTimeout(()=>e.remove(),2400);}
    function fmt(t){if(!isFinite(t)||t<0)return '0:00';const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0');}

    let score=null, pages=[], mode='audio', current=0, playing=false, flipAway=[];
    let cdRemaining=0, cdTimer=null, cdStartTs=0, cdPillTimer=null;
    let loopA=null, loopB=null;
    let viewMode='contain';
    const audio=$('audio'), stage=$('stage'), img=$('pageImg');
    const hasAudio=()=>!!(score&&score.audio_url);
    const viewModeKey=()=>`score-player:view-mode:${scoreId}`;
    function loadViewMode(){
      const saved=localStorage.getItem(viewModeKey());
      viewMode=saved==='scroll'?'scroll':'contain';
      applyViewMode();
    }
    function applyViewMode(){
      const scrollMode=viewMode==='scroll';
      stage.classList.toggle('scroll-mode',scrollMode);
      $('viewModeBtn').classList.toggle('active',scrollMode);
      $('viewModeBtn').textContent=scrollMode?'🔍':'⛶';
      $('viewModeBtn').title=scrollMode?'图片显示模式：滚动模式':'图片显示模式：适应屏幕';
      $('viewModeBtn').setAttribute('aria-pressed',String(scrollMode));
      resetView();
    }
    function toggleViewMode(){
      viewMode=viewMode==='scroll'?'contain':'scroll';
      localStorage.setItem(viewModeKey(),viewMode);
      applyViewMode();
      toast(viewMode==='scroll'?'已切换为滚动模式':'已切换为适应屏幕','ok');
    }

    async function init(){
      try{
        const res=await fetch('/api/scores/'+scoreId);
        if(res.status===401){location.href='/login';return;}
        if(!res.ok){toast('谱子不存在','err');setTimeout(()=>location.href='/',1200);return;}
        score=await res.json();
      }catch(e){toast('加载失败','err');return;}
      pages=score.pages||[]; mode=score.mode; $('title').textContent=score.name;
      flipAway=pages.map(p=>p.turn_seconds||0);
      pages.forEach(p=>{const im=new Image();im.src=p.image_url;});
      if(hasAudio()){
        audio.src=score.audio_url;
        audio.addEventListener('loadedmetadata',()=>{$('durTime').textContent=fmt(audio.duration);});
        audio.addEventListener('timeupdate',onTimeUpdate);
        audio.addEventListener('ended',()=>{playing=false;updatePlayBtn();showBars();});
      }else{ $('progressWrap').style.display='none'; $('abGroup').style.display='none'; $('speedGroup').style.display='none'; }
      if(mode==='countdown') $('cdPill').style.display='block';
      loadViewMode(); setPage(0); bindControls(); updatePlayBtn();
    }

    // ---------- zoom & pan ----------
    let scale=1, tx=0, ty=0;
    function applyT(){ img.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; }
    function resetView(){ scale=1; tx=0; ty=0; applyT(); }
    const clampS=s=>Math.min(6,Math.max(1,s));
    function zoomAt(cx,cy,factor){
      const old=scale; scale=clampS(scale*factor); const k=scale/old;
      tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k;
      if(scale===1){tx=0;ty=0;} applyT();
    }
    // PC wheel
    stage.addEventListener('wheel',e=>{ if(viewMode==='scroll')return; e.preventDefault(); const r=stage.getBoundingClientRect();
      zoomAt(e.clientX-r.left-r.width/2, e.clientY-r.top-r.height/2, e.deltaY<0?1.12:0.89); },{passive:false});
    // PC drag pan (only when zoomed)
    let md=false,lx=0,ly=0;
    stage.addEventListener('mousedown',e=>{ if(viewMode==='scroll'||e.button!==0||scale<=1)return; md=true; lx=e.clientX; ly=e.clientY; stage.classList.add('grabbing'); });
    window.addEventListener('mousemove',e=>{ if(!md)return; tx+=e.clientX-lx; ty+=e.clientY-ly; lx=e.clientX; ly=e.clientY; applyT(); });
    window.addEventListener('mouseup',()=>{md=false;stage.classList.remove('grabbing');});
    stage.addEventListener('dblclick',e=>{e.preventDefault();resetView();});
    // touch: pinch zoom + single drag + double tap reset
    let startDist=0,startScale=1,startMid=null,startTx=0,startTy=0,panLast=null,lastTap=0;
    const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
    const mid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
    stage.addEventListener('touchstart',e=>{
      if(viewMode==='scroll')return;
      if(e.touches.length===2){ startDist=dist(e.touches); startScale=scale; startMid=mid(e.touches); startTx=tx; startTy=ty; panLast=null; }
      else if(e.touches.length===1){ panLast={x:e.touches[0].clientX,y:e.touches[0].clientY};
        const now=Date.now(); if(now-lastTap<300){ resetView(); } lastTap=now; }
    },{passive:false});
    stage.addEventListener('touchmove',e=>{
      if(viewMode==='scroll')return;
      if(e.touches.length===2){ e.preventDefault(); const d=dist(e.touches); scale=clampS(startScale*(d/startDist));
        const m=mid(e.touches); tx=startTx+(m.x-startMid.x); ty=startTy+(m.y-startMid.y); if(scale===1){tx=0;ty=0;} applyT(); }
      else if(e.touches.length===1 && panLast && scale>1){ e.preventDefault(); const t=e.touches[0];
        tx+=t.clientX-panLast.x; ty+=t.clientY-panLast.y; panLast={x:t.clientX,y:t.clientY}; applyT(); }
    },{passive:false});

    // ---------- paging ----------
    function pageStart(i){return i<=0?0:(flipAway[i-1]||0);}
    function setPage(i,seek){
      if(i<0)i=0; if(i>pages.length-1)i=pages.length-1; current=i;
      img.src=pages[i].image_url; $('pageInd').textContent=(i+1)+'/'+pages.length;
      resetView();  // reset zoom/pan per page
      if(mode==='audio'&&hasAudio()&&seek) audio.currentTime=pageStart(i)+0.001;
      if(mode==='countdown') resetCountdown();
    }
    function nextPage(m){ if(current<pages.length-1) setPage(current+1,m); }
    function prevPage(m){ if(current>0) setPage(current-1,m); }

    // ---------- audio timeupdate ----------
    function onTimeUpdate(){
      const t=audio.currentTime, dur=audio.duration||1;
      $('curTime').textContent=fmt(t); $('played').style.height=(t/dur*100)+'%';
      if(loopA!=null&&loopB!=null&&t>=loopB){audio.currentTime=loopA;return;}
      if(mode==='audio'){ let target=0;
        for(let i=0;i<pages.length-1;i++){ const eff=flipAway[i]>0?flipAway[i]:Infinity; if(t>=eff)target=i+1; else break; }
        if(target!==current) setPage(target,false);
      }
    }

    // ---------- countdown ----------
    function resetCountdown(){ clearTimeout(cdTimer); cdTimer=null; const d=flipAway[current]>0?flipAway[current]:0; cdRemaining=d*1000; updateCdPill(); if(playing)startCountdown(); }
    function startCountdown(){ clearTimeout(cdTimer); if(current>=pages.length-1||cdRemaining<=0){updateCdPill();return;} cdStartTs=Date.now(); cdTimer=setTimeout(()=>nextPage(false),cdRemaining); tickPill(); }
    function pauseCountdown(){ clearTimeout(cdTimer); cdTimer=null; if(cdStartTs){cdRemaining-=(Date.now()-cdStartTs);cdStartTs=0;} }
    function tickPill(){ clearInterval(cdPillTimer); cdPillTimer=setInterval(()=>{ if(!playing||mode!=='countdown'){clearInterval(cdPillTimer);return;} updateCdPill(); },200); }
    function updateCdPill(){ if(mode!=='countdown')return; let rem=cdRemaining; if(playing&&cdStartTs)rem=cdRemaining-(Date.now()-cdStartTs);
      if(current>=pages.length-1){$('cdPill').textContent='最后一页';return;}
      if(flipAway[current]<=0){$('cdPill').textContent='本页不翻页';return;}
      $('cdPill').textContent='⏱ '+Math.max(0,rem/1000).toFixed(1)+'s'; }

    // ---------- play / pause ----------
    function play(){ playing=true; if(hasAudio())audio.play().catch(()=>{}); if(mode==='countdown')startCountdown(); updatePlayBtn(); scheduleHide(); }
    function pause(){ playing=false; if(hasAudio())audio.pause(); if(mode==='countdown')pauseCountdown(); updatePlayBtn(); showBars(); clearTimeout(hideTimer); }
    function togglePlay(){ playing?pause():play(); }
    function updatePlayBtn(){ $('playBtn').textContent=playing?'⏸':'▶'; }

    // ---------- speed ----------
    let speed=1.0;
    function setSpeed(v){ speed=Math.min(2.0,Math.max(0.1,Math.round(v*10)/10)); $('speedVal').textContent=speed.toFixed(1)+'x'; if(hasAudio())audio.playbackRate=speed; }

    // ---------- A-B loop (vertical) ----------
    function refreshAB(){ const dur=audio.duration||1;
      const mA=$('markerA'),mB=$('markerB'),f=$('abFill');
      if(loopA!=null){mA.style.display='block';mA.style.bottom=(loopA/dur*100)+'%';}else mA.style.display='none';
      if(loopB!=null){mB.style.display='block';mB.style.bottom=(loopB/dur*100)+'%';}else mB.style.display='none';
      if(loopA!=null&&loopB!=null){f.style.display='block';f.style.bottom=(loopA/dur*100)+'%';f.style.height=((loopB-loopA)/dur*100)+'%';}else f.style.display='none'; }

    // ---------- auto-hide (play-state based) ----------
    let hideTimer=null;
    function showBars(){ $('leftBar').classList.remove('player-hidden'); $('rightBar').classList.remove('player-hidden'); }
    function hideBars(){ if(playing){ $('leftBar').classList.add('player-hidden'); $('rightBar').classList.add('player-hidden'); } }
    function scheduleHide(){ clearTimeout(hideTimer); if(playing) hideTimer=setTimeout(hideBars,3000); }
    function onActivity(){ showBars(); scheduleHide(); }

    // ---------- fullscreen ----------
    function inFs(){ return document.fullscreenElement||$('root').classList.contains('pseudo-fs'); }
    function pseudoFs(on){ const el=$('root'); if(on){el.classList.add('pseudo-fs');document.documentElement.style.overflow='hidden';}else{el.classList.remove('pseudo-fs');document.documentElement.style.overflow='';} }
    function enterFs(){ const el=$('root'); if(el.requestFullscreen)el.requestFullscreen().catch(()=>pseudoFs(true)); else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen(); else pseudoFs(true); $('fsBtn').textContent='⤡'; }
    function exitFs(){ if(document.fullscreenElement)document.exitFullscreen().catch(()=>{}); else if(document.webkitFullscreenElement)document.webkitExitFullscreen(); pseudoFs(false); $('fsBtn').textContent='⛶'; }
    function toggleFs(){ inFs()?exitFs():enterFs(); }
    document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement&&!$('root').classList.contains('pseudo-fs'))$('fsBtn').textContent='⛶'; });

    // ---------- bind ----------
    function bindControls(){
      $('playBtn').addEventListener('click',togglePlay);
      $('prevBtn').addEventListener('click',()=>prevPage(true));
      $('nextBtn').addEventListener('click',()=>nextPage(true));
      $('exportBtn').addEventListener('click',()=>{ window.location.href='/api/scores/'+scoreId+'/export'; });
      $('fsBtn').addEventListener('click',toggleFs);
      $('viewModeBtn').addEventListener('click',toggleViewMode);
      $('zoomReset').addEventListener('click',resetView);
      $('speedUp').addEventListener('click',()=>setSpeed(speed+0.1));
      $('speedDown').addEventListener('click',()=>setSpeed(speed-0.1));
      const bar=$('progressBar');
      function seekAt(cy){ const r=bar.getBoundingClientRect(); const ratio=Math.min(1,Math.max(0,(r.bottom-cy)/r.height)); if(hasAudio()&&audio.duration)audio.currentTime=ratio*audio.duration; }
      let dg=false;
      bar.addEventListener('pointerdown',e=>{e.stopPropagation();dg=true;seekAt(e.clientY);});
      window.addEventListener('pointermove',e=>{if(dg)seekAt(e.clientY);});
      window.addEventListener('pointerup',()=>dg=false);
      $('setA').addEventListener('click',()=>{ if(!hasAudio())return; loopA=audio.currentTime; if(loopB!=null&&loopB<=loopA)loopB=null; $('setA').classList.add('active'); refreshAB(); toast('起点A '+fmt(loopA),'ok'); });
      $('setB').addEventListener('click',()=>{ if(!hasAudio())return; const t=audio.currentTime; if(loopA==null){toast('请先设A','err');return;} if(t<=loopA){toast('B需晚于A','err');return;} loopB=t; $('setB').classList.add('active'); refreshAB(); toast('终点B '+fmt(loopB),'ok'); });
      $('clearAB').addEventListener('click',()=>{ loopA=loopB=null; $('setA').classList.remove('active'); $('setB').classList.remove('active'); refreshAB(); toast('已取消循环','ok'); });
      ['mousemove','touchstart','click','keydown','wheel'].forEach(ev=>document.addEventListener(ev,onActivity,{passive:true}));
      document.addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();togglePlay();} else if(e.code==='ArrowRight')nextPage(true); else if(e.code==='ArrowLeft')prevPage(true); else if(e.key==='f'||e.key==='F')toggleFs(); else if(e.key==='0')resetView(); });
    }

    init();
  </script>
</body>
</html>
