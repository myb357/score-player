<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>播放</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#7c5cff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="谱子播放器">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/style.css" />
  <script>
    /* ---- 方案B: offline/web dual-mode runtime ---- */
    var IS_FILE = location.protocol === 'file:';
    /* ---- 服务端点故障切换：Cloudflare Tunnel 优先 + Tailscale 备用 + Render 最终兜底（仅离线 APK/file:// 生效）---- */
    var API_PRIMARY = 'https://scoreplayer-myb.top';   /* Cloudflare Tunnel（主）*/
    var API_FALLBACK = 'https://istoreos.tail11098d.ts.net';   /* Tailscale 软路由（备）*/
    var API_FALLBACK2 = 'https://score-player.onrender.com';   /* Render（最终兜底）*/
    var API_PROBE_TIMEOUT = 4000;   /* Render 健康探测超时(ms)，3-5s */
    var API_CHOICE_TTL = 60000;     /* 端点选择缓存(ms)，跨页面复用，避免每次重探 */
    /* Web 模式(同源)保持相对路径 ''；离线 APK 默认先用 Cloudflare Tunnel 主地址 */
    var API_BASE = IS_FILE ? API_PRIMARY : '';
    function __epToast(msg) {
      try {
        if (!IS_FILE) return;
        var d = document.createElement('div');
        d.textContent = msg;
        d.style.cssText = 'position:fixed;left:50%;bottom:48px;transform:translateX(-50%);'
          + 'z-index:99999;background:rgba(40,40,48,.92);color:#fff;padding:10px 16px;'
          + 'border-radius:20px;font-size:13px;max-width:80%;text-align:center;'
          + 'box-shadow:0 4px 16px rgba(0,0,0,.25);pointer-events:none;';
        (document.body || document.documentElement).appendChild(d);
        setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 2600);
      } catch (e) {}
    }
    function __epSetBase(base, reason) {
      if (API_BASE === base) return;
      API_BASE = base;
      try { sessionStorage.setItem('api_base_choice', base + '|' + Date.now()); } catch (e) {}
      if (base === API_FALLBACK) __epToast('主服务不可用，已切换到 Tailscale 软路由' + (reason || ''));
      if (base === API_FALLBACK2) __epToast('主服务和 Tailscale 均不可用，已切换到 Render 最终兜底' + (reason || ''));
    }
    function __epProbe(url, timeout) {
      if (typeof AbortController === 'undefined') return fetch(url, { cache: 'no-store' });
      var ctrl = new AbortController();
      var t = setTimeout(function () { ctrl.abort(); }, timeout);
      return fetch(url, { cache: 'no-store', signal: ctrl.signal })
        .finally(function () { clearTimeout(t); });
    }
    /* 端点选择：探测 Render /api/v1/ping；成功用 Render，超时/失败切软路由。
       结果缓存在 sessionStorage，TTL 内跨页面直接复用。返回 Promise。 */
    var __apiBaseReady = (function () {
      if (!IS_FILE) return Promise.resolve('');
      try {
        var cached = sessionStorage.getItem('api_base_choice');
        if (cached) {
          var p = cached.split('|');
          if (p[0] && (Date.now() - (parseInt(p[1], 10) || 0)) < API_CHOICE_TTL) {
            API_BASE = p[0]; return Promise.resolve(API_BASE);
          }
        }
      } catch (e) {}
      return __epProbe(API_PRIMARY + '/api/v1/ping', API_PROBE_TIMEOUT)
        .then(function (r) {
          if (r && r.ok) { __epSetBase(API_PRIMARY); return API_PRIMARY; }
          return __epProbe(API_FALLBACK + '/api/v1/ping', API_PROBE_TIMEOUT)
            .then(function (r2) {
              if (r2 && r2.ok) { __epSetBase(API_FALLBACK); return API_FALLBACK; }
              __epSetBase(API_FALLBACK2); return API_FALLBACK2;
            })
            .catch(function () { __epSetBase(API_FALLBACK2); return API_FALLBACK2; });
        })
        .catch(function () {
          return __epProbe(API_FALLBACK + '/api/v1/ping', API_PROBE_TIMEOUT)
            .then(function (r2) {
              if (r2 && r2.ok) { __epSetBase(API_FALLBACK); return API_FALLBACK; }
              __epSetBase(API_FALLBACK2); return API_FALLBACK2;
            })
            .catch(function () { __epSetBase(API_FALLBACK2); return API_FALLBACK2; });
        });
    })();
    function __epRebase(url) {
      if (!IS_FILE || !url) return url;
      if (url.indexOf(API_PRIMARY) === 0) return API_BASE + url.slice(API_PRIMARY.length);
      if (url.indexOf(API_FALLBACK) === 0) return API_BASE + url.slice(API_FALLBACK.length);
      if (url.indexOf(API_FALLBACK2) === 0) return API_BASE + url.slice(API_FALLBACK2.length);
      return url;
    }
    /* 统一网络出口：等待端点就绪→按当前 base 请求；网络层硬失败则切另一端点重试一次。
       注意：不对正常请求加超时，避免中断上传/转码等长耗时请求。 */
    window.__epFetch = function (url, opts) {
      return __apiBaseReady.then(function () {
        var u = __epRebase(url);
        var switchable = IS_FILE && u.indexOf(API_BASE) === 0;
        return fetch(u, opts).catch(function (err) {
          if (!switchable) throw err;
          var other = (API_BASE === API_PRIMARY) ? API_FALLBACK : API_PRIMARY;
          __epSetBase(other, '（网络异常）');
          return fetch(__epRebase(u), opts);
        });
      });
    };
    function authToken() {
      try {
        var token = '';
        if (window.AndroidBridge && typeof window.AndroidBridge.getToken === 'function') {
          token = window.AndroidBridge.getToken() || '';
        }
        return token || localStorage.getItem('auth_token') || '';
      } catch (e) { return ''; }
    }
    function clearAuthToken() {
      try {
        localStorage.removeItem('auth_token');
        if (window.AndroidBridge && typeof window.AndroidBridge.clearToken === 'function') {
          window.AndroidBridge.clearToken();
        }
      } catch (e) {}
    }
    function mediaUrl(u) { return (u && u.charAt(0) === '/') ? (API_BASE + u) : u; }
    function apiFetch(path, opts) {
      opts = opts || {};
      var url = /^https?:/i.test(path) ? path : (API_BASE + path);
      var headers = new Headers(opts.headers || {});
      var t = authToken();
      if (t) headers.set('Authorization', 'Bearer ' + t);
      opts.headers = headers;
      return window.__epFetch(url, opts);
    }
    function goHome() { location.href = IS_FILE ? 'home.html' : '/'; }
    function goLogin() { location.href = IS_FILE ? 'login.html' : '/login'; }
    function goPlayer(id) { location.href = IS_FILE ? ('player.html?id=' + id) : ('/player/' + id); }
    function goNew(editId) { location.href = (IS_FILE ? 'new.html' : '/new') + (editId ? '?edit=' + editId : ''); }
    if (IS_FILE) {
      var _cssLink = document.createElement('link');
      _cssLink.rel = 'stylesheet'; _cssLink.href = 'style.css';
      document.head.appendChild(_cssLink);
    }
  </script>
  <script>
    /* ============================================================
       离线下载共享模块 (ScoreDB) —— home / player / downloads 三处保持完全一致
       使用 IndexedDB 存储谱子元数据 + 图片 Blob + 音频 Blob。
       依赖上方 runtime 中的 apiFetch / mediaUrl。
       ============================================================ */
    var ScoreDB = (function () {
      var DB_NAME = 'score-player-offline';
      var DB_VERSION = 2;
      var STORE_META = 'meta';    // keyPath: id  -> {id,name,mode,page_count,has_audio,audio_path,pages[],cover_path,size,downloaded_at}
      var STORE_BLOBS = 'blobs';  // keyPath: path -> {path,scoreId,type,blob}
      var _dbPromise = null;

      function open() {
        if (_dbPromise) return _dbPromise;
        _dbPromise = new Promise(function (resolve, reject) {
          if (!('indexedDB' in window)) { reject(new Error('当前环境不支持 IndexedDB')); return; }
          var req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = function (e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_META)) {
              db.createObjectStore(STORE_META, { keyPath: 'id' });
            }
            if (!db.objectStoreNames.contains(STORE_BLOBS)) {
              var s = db.createObjectStore(STORE_BLOBS, { keyPath: 'path' });
              s.createIndex('scoreId', 'scoreId', { unique: false });
            }
          };
          req.onsuccess = function () { resolve(req.result); };
          req.onerror = function () { reject(req.error); };
        });
        return _dbPromise;
      }

      function reqPromise(request) {
        return new Promise(function (resolve, reject) {
          request.onsuccess = function () { resolve(request.result); };
          request.onerror = function () { reject(request.error); };
        });
      }

      function getMeta(id) {
        return open().then(function (db) {
          return reqPromise(db.transaction(STORE_META, 'readonly').objectStore(STORE_META).get(Number(id)));
        });
      }

      function getAllMeta() {
        return open().then(function (db) {
          return reqPromise(db.transaction(STORE_META, 'readonly').objectStore(STORE_META).getAll());
        }).then(function (list) { return list || []; });
      }

      function getDownloadedIds() {
        return getAllMeta().then(function (list) {
          return list.map(function (m) { return Number(m.id); });
        });
      }

      function isDownloaded(id) {
        return getMeta(id).then(function (m) { return !!m; }).catch(function () { return false; });
      }

      function blobKeyCandidates(path) {
        var keys = [];
        function add(v) { if (v && keys.indexOf(v) < 0) keys.push(v); }
        add(path);
        try {
          var u = new URL(path, location.origin);
          add(u.pathname + u.search);
          add(u.href);
        } catch (e) {}
        return keys;
      }

      function getBlob(path) {
        return open().then(function (db) {
          var store = db.transaction(STORE_BLOBS, 'readonly').objectStore(STORE_BLOBS);
          var keys = blobKeyCandidates(path);
          var chain = Promise.resolve(null);
          keys.forEach(function (key) {
            chain = chain.then(function (found) {
              if (found) return found;
              return reqPromise(store.get(key));
            });
          });
          return chain;
        }).then(function (rec) { return rec ? rec.blob : null; });
      }

      function localAssetUrl(path) {
        if (!path) return Promise.resolve(null);
        return getBlob(path).then(function (blob) { return blob ? URL.createObjectURL(blob) : null; }).catch(function () { return null; });
      }

      function saveScore(meta, blobs) {
        return open().then(function (db) {
          return new Promise(function (resolve, reject) {
            var t = db.transaction([STORE_META, STORE_BLOBS], 'readwrite');
            t.oncomplete = function () { resolve(true); };
            t.onerror = function () { reject(t.error); };
            t.onabort = function () { reject(t.error); };
            t.objectStore(STORE_META).put(meta);
            var bs = t.objectStore(STORE_BLOBS);
            (blobs || []).forEach(function (b) { bs.put(b); });
          });
        });
      }

      function deleteScore(id) {
        id = Number(id);
        return open().then(function (db) {
          return new Promise(function (resolve, reject) {
            var t = db.transaction([STORE_META, STORE_BLOBS], 'readwrite');
            t.oncomplete = function () { resolve(true); };
            t.onerror = function () { reject(t.error); };
            t.onabort = function () { reject(t.error); };
            t.objectStore(STORE_META).delete(id);
            var curReq = t.objectStore(STORE_BLOBS).index('scoreId').openCursor(IDBKeyRange.only(id));
            curReq.onsuccess = function (e) {
              var cursor = e.target.result;
              if (cursor) { cursor.delete(); cursor.continue(); }
            };
          });
        });
      }

      // 下载单个谱子的全部资源到 IndexedDB。onProgress(done,total) 可选。
      function downloadScore(id, onProgress) {
        id = Number(id);
        return apiFetch('/api/scores/' + id, { cache: 'no-store' }).then(function (res) {
          if (res.status === 401) throw new Error('登录已失效');
          if (!res.ok) throw new Error('获取谱子信息失败');
          return res.json();
        }).then(function (detail) {
          var pages = detail.pages || [];
          var total = pages.length + (detail.audio_url ? 1 : 0);
          var done = 0;
          var blobs = [];
          var tasks = [];
          function tick() { done++; if (typeof onProgress === 'function') onProgress(done, total); }
          function fetchBlob(url) {
            return fetch(mediaUrl(url), { cache: 'no-store' }).then(function (r) {
              if (!r.ok) throw new Error('资源下载失败: ' + url);
              return r.blob();
            });
          }
          pages.forEach(function (p) {
            tasks.push(fetchBlob(p.image_url).then(function (blob) {
              blobs.push({ path: p.image_url, scoreId: id, type: 'image', blob: blob });
              tick();
            }));
          });
          if (detail.audio_url) {
            tasks.push(fetchBlob(detail.audio_url).then(function (blob) {
              blobs.push({ path: detail.audio_url, scoreId: id, type: 'audio', blob: blob });
              tick();
            }));
          }
          return Promise.all(tasks).then(function () {
            var size = blobs.reduce(function (acc, b) { return acc + (b.blob ? b.blob.size : 0); }, 0);
            var meta = {
              id: id,
              name: detail.name,
              mode: detail.mode,
              page_count: pages.length,
              has_audio: !!detail.audio_url,
              audio_path: detail.audio_url || '',
              pages: pages.map(function (p) { return { index: p.index, image_path: p.image_url, turn_seconds: p.turn_seconds }; }),
              cover_path: pages.length ? pages[0].image_url : '',
              size: size,
              downloaded_at: Date.now()
            };
            return saveScore(meta, blobs).then(function () { return meta; });
          });
        });
      }

      function formatSize(bytes) {
        bytes = bytes || 0;
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      }

      return {
        open: open,
        getMeta: getMeta,
        getAllMeta: getAllMeta,
        getDownloadedIds: getDownloadedIds,
        isDownloaded: isDownloaded,
        getBlob: getBlob,
        localAssetUrl: localAssetUrl,
        saveScore: saveScore,
        deleteScore: deleteScore,
        downloadScore: downloadScore,
        formatSize: formatSize
      };
    })();
  </script>
  <style>
    #pageImg { will-change: transform; transform-origin: center center; touch-action: none; }
    .stage { touch-action: none; cursor: grab; }
    .stage.grabbing { cursor: grabbing; }
    .player-root.pseudo-fs { position: fixed; inset: 0; z-index: 9999; width:100vw; height:100vh; }
  </style>
</head>
<body>
  <div class="player-root" id="root">
    <div class="player-body">
      <!-- LEFT: navigation -->
      <div class="side-bar left" id="leftBar">
        <a class="round-btn" href="/" id="backBtn" title="返回">‹</a>
        <div class="bar-title" id="title">加载中</div>
        <div class="bar-spacer"></div>
        <button class="round-btn" id="prevBtn" title="上一页">⏮</button>
        <div class="page-ind-v" id="pageInd">1/1</div>
        <button class="round-btn" id="nextBtn" title="下一页">⏭</button>
        <div class="bar-spacer"></div>
        <button class="round-btn" id="zoomReset" title="还原大小">⤢</button>
        <button class="round-btn" id="viewModeBtn" title="图片显示模式：适应屏幕" aria-label="切换图片显示模式">⛶</button>
        <button class="round-btn" id="fsBtn" title="全屏">⛶</button>
      </div>

      <!-- STAGE -->
      <div class="stage" id="stage">
        <img id="pageImg" alt="谱页" />
        <div class="page-loading" id="pageLoading"><span class="spinner"></span></div>
        <div class="mini-progress" id="miniProgress" aria-label="播放进度" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="mini-progress-fill" id="miniProgressFill"></div>
        </div>
        <div class="seek-preview" id="seekPreview" aria-hidden="true">
          <div class="seek-preview-head">
            <span id="seekPreviewLabel">快进</span>
            <strong id="seekPreviewTime">0:00</strong>
          </div>
          <div class="seek-preview-track">
            <div class="seek-preview-fill" id="seekPreviewFill"></div>
          </div>
        </div>
      </div>

      <!-- RIGHT: playback -->
      <div class="side-bar right" id="rightBar">
        <button class="play-btn" id="playBtn" title="播放/暂停">▶</button>
        <div class="vprogress-wrap" id="progressWrap">
          <span class="vtime" id="durTime">0:00</span>
          <div class="vprogress" id="progressBar">
            <div class="vprogress-ab" id="abFill" style="display:none;"></div>
            <div class="vprogress-played" id="played"></div>
            <div class="vmarker" id="markerA" style="display:none;"></div>
            <div class="vmarker" id="markerB" style="display:none;"></div>
          </div>
          <span class="vtime" id="curTime">0:00</span>
        </div>
        <div class="speed-v" id="speedGroup">
          <button class="round-btn sm" id="speedUp">＋</button>
          <span class="speed-val" id="speedVal">1.0x</span>
          <span class="lbl">倍速</span>
          <button class="round-btn sm" id="speedDown">−</button>
        </div>
        <div class="ab-v" id="abGroup">
          <span class="lbl">循环</span>
          <button class="round-btn sm" id="setA" title="设起点A">A</button>
          <button class="round-btn sm" id="setB" title="设终点B">B</button>
          <button class="round-btn sm" id="clearAB" title="取消循环">✕</button>
        </div>
        <div class="countdown-pill" id="cdPill" style="display:none;">倒计时 —</div>
      </div>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script>
    const scoreId = new URLSearchParams(location.search).get('id') || window.location.pathname.split('/').pop();
    const $ = id => document.getElementById(id);
    function toast(m,t){const w=$('toasts');const e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;w.appendChild(e);setTimeout(()=>e.remove(),2400);}
    function fmt(t){if(!isFinite(t)||t<0)return '0:00';const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0');}

    let score=null, pages=[], mode='audio', current=0, playing=false, flipAway=[];
    let cdRemaining=0, cdTimer=null, cdStartTs=0, cdPillTimer=null;
    let loopA=null, loopB=null;
    let viewMode='contain';
    const audio=$('audio'), stage=$('stage'), img=$('pageImg');
    const pageLoading=$('pageLoading'), miniProgress=$('miniProgress'), miniProgressFill=$('miniProgressFill');
    const hasAudio=()=>!!(score&&score.audio_url);
    const SCORE_CACHE_NAME='score-player-score-assets-v1';
    const detailCacheKey=()=>`score-player:score-detail:${scoreId}`;
    const versionOf=s=>(s&&(s.updated_at||s.updated_at_text||s.modified_at||s.created_at_text||s.name))||'';

    function readCachedScore(){
      try{return JSON.parse(localStorage.getItem(detailCacheKey())||'null');}
      catch(e){return null;}
    }
    function writeCachedScore(data){
      try{localStorage.setItem(detailCacheKey(),JSON.stringify({score:data,version:versionOf(data),cachedAt:Date.now()}));}
      catch(e){/* ignore quota/private mode errors */}
    }
    async function openAssetCache(){return 'caches' in window?caches.open(SCORE_CACHE_NAME):null;}
    async function cachedAssetUrl(url, path){
      if(!url)return '';
      // 1) 优先离线下载 (IndexedDB) —— 断网时仍可用
      if(path){
        try{ const local=await ScoreDB.localAssetUrl(path); if(local) return local; }catch(e){/* fall through */}
      }
      // 2) Service Worker Cache API
      const cache=await openAssetCache();
      if(cache){ const cached=await cache.match(url); if(cached)return URL.createObjectURL(await cached.blob()); }
      // 3) 网络原始地址
      return url;
    }
    async function refreshAsset(url){
      const cache=await openAssetCache();
      if(!cache||!url)return;
      try{
        const res=await fetch(url,{cache:'no-store'});
        if(res.ok)await cache.put(url,res.clone());
      }catch(e){/* keep existing cache */}
    }
    async function cacheScoreAssets(data){
      const firstPages=(data.pages||[]).slice(0,2).map(p=>refreshAsset(p.image_url));
      if(data.audio_url)firstPages.push(refreshAsset(data.audio_url));
      await Promise.allSettled(firstPages);
    }
    function preloadPage(i){
      const p=pages[i];
      if(!p||!p.image_url)return;
      const preloader=new Image();
      preloader.decoding='async';
      preloader.src=p.cached_image_url||p.image_url;
      refreshAsset(p.image_url);
    }
    let controlsBound=false;
    async function applyScore(data){
      // Normalize media URLs to absolute so they load under file:// (offline app).
      // Keep the original /api/media path for IndexedDB (offline download) lookup.
      (data.pages||[]).forEach(p=>{ if(p&&p.image_url){ if(!p.image_path)p.image_path=p.image_url; p.image_url=mediaUrl(p.image_url); } });
      if(data.audio_url){ if(!data.audio_path)data.audio_path=data.audio_url; data.audio_url=mediaUrl(data.audio_url); }
      score=data; pages=score.pages||[]; mode=score.mode; $('title').textContent=score.name;
      flipAway=pages.map(p=>p.turn_seconds||0);
      await Promise.all(pages.map(async p=>{p.cached_image_url=await cachedAssetUrl(p.image_url, p.image_path);}));
      if(hasAudio()){
        audio.src=await cachedAssetUrl(score.audio_url, score.audio_path);
        audio.onloadedmetadata=()=>{$('durTime').textContent=fmt(audio.duration);};
        audio.ontimeupdate=onTimeUpdate;
        audio.onended=()=>{playing=false;updatePlayBtn();showBars();};
      }else{ $('progressWrap').style.display='none'; $('abGroup').style.display='none'; $('speedGroup').style.display='none'; }
      if(mode==='countdown') $('cdPill').style.display='block';
      loadViewMode(); setPage(0); if(!controlsBound){bindControls(); controlsBound=true;} updatePlayBtn();
    }
    const viewModeKey=()=>`score-player:view-mode:${scoreId}`;
    function loadViewMode(){
      const saved=localStorage.getItem(viewModeKey());
      viewMode=saved==='scroll'?'scroll':'contain';
      applyViewMode();
    }
    function applyViewMode(){
      const scrollMode=viewMode==='scroll';
      stage.classList.toggle('scroll-mode',scrollMode);
      $('viewModeBtn').classList.toggle('active',scrollMode);
      $('viewModeBtn').textContent=scrollMode?'🔍':'⛶';
      $('viewModeBtn').title=scrollMode?'图片显示模式：滚动模式':'图片显示模式：适应屏幕';
      $('viewModeBtn').setAttribute('aria-pressed',String(scrollMode));
      resetView();
    }
    function toggleViewMode(){
      viewMode=viewMode==='scroll'?'contain':'scroll';
      localStorage.setItem(viewModeKey(),viewMode);
      applyViewMode();
      toast(viewMode==='scroll'?'已切换为滚动模式':'已切换为适应屏幕','ok');
    }

    function metaToScore(meta){
      return {
        id: meta.id,
        name: meta.name,
        mode: meta.mode,
        audio_url: meta.audio_path || null,
        audio_path: meta.audio_path || null,
        pages: (meta.pages||[]).map(p=>({ index:p.index, image_url:p.image_path, image_path:p.image_path, turn_seconds:p.turn_seconds }))
      };
    }

    async function init(){
      let hasLocal=false;
      let hasDownloaded=false;
      // 已下载谱子必须优先使用 IndexedDB 中的本地 blob，避免播放页打开后又回源拉图片/音频。
      try{
        const meta=await ScoreDB.getMeta(scoreId);
        if(meta){
          await applyScore(metaToScore(meta));
          hasLocal=true;
          hasDownloaded=true;
          toast('已加载本地下载内容','ok');
        }
      }catch(e){/* ignore */}
      if(hasDownloaded) return;

      const cached=readCachedScore();
      if(cached&&cached.score){
        await applyScore(cached.score);
        hasLocal=true;
      }
      try{
        const res=await apiFetch('/api/scores/'+scoreId,{cache:'no-store'});
        if(res.status===401){goLogin();return;}
        if(!res.ok){ if(!hasLocal){toast('谱子不存在','err');setTimeout(()=>goHome(),1200);} return; }
        const fresh=await res.json();
        writeCachedScore(fresh);
        await cacheScoreAssets(fresh);
        await applyScore(fresh);
      }catch(e){
        if(!hasLocal)toast('加载失败','err');
        else toast('已使用本地缓存内容','ok');
      }
    }

    // ---------- zoom & pan ----------
    let scale=1, tx=0, ty=0;
    function applyT(){ img.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; }
    function resetView(){ scale=1; tx=0; ty=0; applyT(); }
    const clampS=s=>Math.min(6,Math.max(1,s));
    function zoomAt(cx,cy,factor){
      const old=scale; scale=clampS(scale*factor); const k=scale/old;
      tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k;
      if(scale===1){tx=0;ty=0;} applyT();
    }
    // PC wheel
    stage.addEventListener('wheel',e=>{ if(viewMode==='scroll')return; e.preventDefault(); const r=stage.getBoundingClientRect();
      zoomAt(e.clientX-r.left-r.width/2, e.clientY-r.top-r.height/2, e.deltaY<0?1.12:0.89); },{passive:false});
    // PC drag pan (only when zoomed)
    let md=false,lx=0,ly=0;
    stage.addEventListener('mousedown',e=>{ if(viewMode==='scroll'||e.button!==0||scale<=1)return; md=true; lx=e.clientX; ly=e.clientY; stage.classList.add('grabbing'); });
    window.addEventListener('mousemove',e=>{ if(!md)return; tx+=e.clientX-lx; ty+=e.clientY-ly; lx=e.clientX; ly=e.clientY; applyT(); });
    window.addEventListener('mouseup',()=>{md=false;stage.classList.remove('grabbing');});
    stage.addEventListener('dblclick',e=>{e.preventDefault(); if(mode==='audio'&&hasAudio())togglePlay(); else resetView();});
    // touch: pinch zoom + single drag + double tap reset + horizontal seek
    let startDist=0,startScale=1,startMid=null,startTx=0,startTy=0,panLast=null,lastTap=0;
    let seekTouch=null;
    const SEEK_STEP_SECONDS=5;
    const SEEK_STEP_PIXELS=50;
    const SEEK_START_THRESHOLD=16;
    const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
    const mid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
    const clampTime=t=>Math.min(audio.duration||0,Math.max(0,t));
    const canSeekAudio=()=>mode==='audio'&&hasAudio()&&isFinite(audio.duration)&&audio.duration>0;
    function previewSeek(target,label){
      if(!canSeekAudio())return;
      target=clampTime(target);
      $('seekPreviewLabel').textContent=label;
      $('seekPreviewTime').textContent=fmt(target);
      $('seekPreviewFill').style.width=(target/audio.duration*100)+'%';
      $('seekPreview').classList.add('show');
      $('curTime').textContent=fmt(target);
      $('played').style.height=(target/audio.duration*100)+'%';
    }
    function hideSeekPreview(){ $('seekPreview').classList.remove('show'); }
    function seekTo(t,label){
      if(!canSeekAudio())return false;
      audio.currentTime=clampTime(t);
      onTimeUpdate();
      if(label)toast(label+' '+fmt(audio.currentTime),'ok');
      return true;
    }
    function seekBy(delta){
      const ok=seekTo(audio.currentTime+delta,delta>0?'快进':'快退');
      if(ok)previewSeek(audio.currentTime,delta>0?'快进':'快退');
      setTimeout(hideSeekPreview,500);
      return ok;
    }
    stage.addEventListener('touchstart',e=>{
      if(viewMode==='scroll')return;
      seekTouch=null;
      if(e.touches.length===2){ startDist=dist(e.touches); startScale=scale; startMid=mid(e.touches); startTx=tx; startTy=ty; panLast=null; }
      else if(e.touches.length===1){ const t=e.touches[0]; panLast={x:t.clientX,y:t.clientY};
        seekTouch=canSeekAudio()&&scale<=1?{startX:t.clientX,startY:t.clientY,base:audio.currentTime,target:audio.currentTime,active:false}:null;
        const now=Date.now(); if(now-lastTap<300){ e.preventDefault(); if(mode==='audio'&&hasAudio())togglePlay(); else resetView(); seekTouch=null; } lastTap=now; }
    },{passive:false});
    stage.addEventListener('touchmove',e=>{
      if(viewMode==='scroll')return;
      if(e.touches.length===2){ e.preventDefault(); seekTouch=null; const d=dist(e.touches); scale=clampS(startScale*(d/startDist));
        const m=mid(e.touches); tx=startTx+(m.x-startMid.x); ty=startTy+(m.y-startMid.y); if(scale===1){tx=0;ty=0;} applyT(); }
      else if(e.touches.length===1 && panLast && scale>1){ e.preventDefault(); seekTouch=null; const t=e.touches[0];
        tx+=t.clientX-panLast.x; ty+=t.clientY-panLast.y; panLast={x:t.clientX,y:t.clientY}; applyT(); }
      else if(e.touches.length===1 && seekTouch){ const t=e.touches[0], dx=t.clientX-seekTouch.startX, dy=t.clientY-seekTouch.startY;
        if(!seekTouch.active && Math.abs(dx)>SEEK_START_THRESHOLD && Math.abs(dx)>Math.abs(dy)*1.4)seekTouch.active=true;
        if(seekTouch.active){ e.preventDefault(); const delta=dx/SEEK_STEP_PIXELS*SEEK_STEP_SECONDS; seekTouch.target=clampTime(seekTouch.base+delta); previewSeek(seekTouch.target,delta>=0?'快进':'快退'); }
      }
    },{passive:false});
    stage.addEventListener('touchend',()=>{
      if(seekTouch&&seekTouch.active)seekTo(seekTouch.target,seekTouch.target>=seekTouch.base?'快进':'快退');
      seekTouch=null; hideSeekPreview();
    },{passive:false});
    stage.addEventListener('touchcancel',()=>{seekTouch=null;hideSeekPreview();},{passive:false});

    // ---------- paging ----------
    function pageStart(i){return i<=0?0:(flipAway[i-1]||0);}
    function setPage(i,seek){
      if(i<0)i=0; if(i>pages.length-1)i=pages.length-1; current=i;
      pageLoading.classList.add('show');
      img.onload=()=>{pageLoading.classList.remove('show');preloadPage(current+1);};
      img.onerror=()=>pageLoading.classList.remove('show');
      img.src=pages[i].cached_image_url||pages[i].image_url; $('pageInd').textContent=(i+1)+'/'+pages.length;
      resetView();  // reset zoom/pan per page
      if(mode==='audio'&&hasAudio()&&seek) audio.currentTime=pageStart(i)+0.001;
      if(mode==='countdown') resetCountdown();
    }
    function nextPage(m){ if(current<pages.length-1) setPage(current+1,m); }
    function prevPage(m){ if(current>0) setPage(current-1,m); }

    function updateMiniProgress(t,dur){
      const pct=dur>0?Math.max(0,Math.min(100,t/dur*100)):0;
      miniProgressFill.style.width=pct+'%';
      miniProgress.setAttribute('aria-valuenow',String(Math.round(pct)));
    }
    function seekFromMiniProgress(clientX){
      if(!canSeekAudio())return;
      const r=miniProgress.getBoundingClientRect();
      const pct=Math.max(0,Math.min(1,(clientX-r.left)/r.width));
      seekTo(pct*audio.duration);
    }
    let miniSeeking=false;
    miniProgress.addEventListener('pointerdown',e=>{e.preventDefault();miniSeeking=true;miniProgress.setPointerCapture(e.pointerId);seekFromMiniProgress(e.clientX);});
    miniProgress.addEventListener('pointermove',e=>{if(miniSeeking){e.preventDefault();seekFromMiniProgress(e.clientX);}});
    miniProgress.addEventListener('pointerup',()=>{miniSeeking=false;});
    miniProgress.addEventListener('pointercancel',()=>{miniSeeking=false;});

    // ---------- audio timeupdate ----------
    function onTimeUpdate(){
      const t=audio.currentTime, dur=audio.duration||1;
      $('curTime').textContent=fmt(t); $('played').style.height=(t/dur*100)+'%'; updateMiniProgress(t,dur);
      if(loopA!=null&&loopB!=null&&t>=loopB){audio.currentTime=loopA;return;}
      if(mode==='audio'){ let target=0;
        for(let i=0;i<pages.length-1;i++){ const eff=flipAway[i]>0?flipAway[i]:Infinity; if(t>=eff)target=i+1; else break; }
        if(target!==current) setPage(target,false);
      }
    }

    // ---------- countdown ----------
    function resetCountdown(){ clearTimeout(cdTimer); cdTimer=null; const d=flipAway[current]>0?flipAway[current]:0; cdRemaining=d*1000; updateCdPill(); if(playing)startCountdown(); }
    function startCountdown(){ clearTimeout(cdTimer); if(current>=pages.length-1||cdRemaining<=0){updateCdPill();return;} cdStartTs=Date.now(); cdTimer=setTimeout(()=>nextPage(false),cdRemaining); tickPill(); }
    function pauseCountdown(){ clearTimeout(cdTimer); cdTimer=null; if(cdStartTs){cdRemaining-=(Date.now()-cdStartTs);cdStartTs=0;} }
    function tickPill(){ clearInterval(cdPillTimer); cdPillTimer=setInterval(()=>{ if(!playing||mode!=='countdown'){clearInterval(cdPillTimer);return;} updateCdPill(); },200); }
    function updateCdPill(){ if(mode!=='countdown')return; let rem=cdRemaining; if(playing&&cdStartTs)rem=cdRemaining-(Date.now()-cdStartTs);
      if(current>=pages.length-1){$('cdPill').textContent='最后一页';return;}
      if(flipAway[current]<=0){$('cdPill').textContent='本页不翻页';return;}
      $('cdPill').textContent='⏱ '+Math.max(0,rem/1000).toFixed(1)+'s'; }

    // ---------- play / pause ----------
    function play(){ playing=true; if(hasAudio())audio.play().catch(()=>{}); if(mode==='countdown')startCountdown(); updatePlayBtn(); scheduleHide(); }
    function pause(){ playing=false; if(hasAudio())audio.pause(); if(mode==='countdown')pauseCountdown(); updatePlayBtn(); showBars(); clearTimeout(hideTimer); }
    function togglePlay(){ playing?pause():play(); }
    function updatePlayBtn(){ $('playBtn').textContent=playing?'⏸':'▶'; }

    // ---------- speed ----------
    let speed=1.0;
    function setSpeed(v){ speed=Math.min(2.0,Math.max(0.1,Math.round(v*10)/10)); $('speedVal').textContent=speed.toFixed(1)+'x'; if(hasAudio())audio.playbackRate=speed; }

    // ---------- A-B loop (vertical) ----------
    function refreshAB(){ const dur=audio.duration||1;
      const mA=$('markerA'),mB=$('markerB'),f=$('abFill');
      if(loopA!=null){mA.style.display='block';mA.style.bottom=(loopA/dur*100)+'%';}else mA.style.display='none';
      if(loopB!=null){mB.style.display='block';mB.style.bottom=(loopB/dur*100)+'%';}else mB.style.display='none';
      if(loopA!=null&&loopB!=null){f.style.display='block';f.style.bottom=(loopA/dur*100)+'%';f.style.height=((loopB-loopA)/dur*100)+'%';}else f.style.display='none'; }

    // ---------- auto-hide (play-state based) ----------
    let hideTimer=null;
    function showBars(){ $('leftBar').classList.remove('player-hidden'); $('rightBar').classList.remove('player-hidden'); }
    function hideBars(){ if(playing){ $('leftBar').classList.add('player-hidden'); $('rightBar').classList.add('player-hidden'); } }
    function scheduleHide(){ clearTimeout(hideTimer); if(playing) hideTimer=setTimeout(hideBars,3000); }
    function onActivity(){ showBars(); scheduleHide(); }

    // ---------- fullscreen ----------
    function inFs(){ return document.fullscreenElement||$('root').classList.contains('pseudo-fs'); }
    function pseudoFs(on){ const el=$('root'); if(on){el.classList.add('pseudo-fs');document.documentElement.style.overflow='hidden';}else{el.classList.remove('pseudo-fs');document.documentElement.style.overflow='';} }
    function enterFs(){ const el=$('root'); if(el.requestFullscreen)el.requestFullscreen().catch(()=>pseudoFs(true)); else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen(); else pseudoFs(true); $('fsBtn').textContent='⤡'; }
    function exitFs(){ if(document.fullscreenElement)document.exitFullscreen().catch(()=>{}); else if(document.webkitFullscreenElement)document.webkitExitFullscreen(); pseudoFs(false); $('fsBtn').textContent='⛶'; }
    function toggleFs(){ inFs()?exitFs():enterFs(); }
    document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement&&!$('root').classList.contains('pseudo-fs'))$('fsBtn').textContent='⛶'; });

    // ---------- bind ----------
    function bindControls(){
      $('playBtn').addEventListener('click',togglePlay);
      $('prevBtn').addEventListener('click',()=>prevPage(true));
      $('nextBtn').addEventListener('click',()=>nextPage(true));
      $('fsBtn').addEventListener('click',toggleFs);
      $('viewModeBtn').addEventListener('click',toggleViewMode);
      $('zoomReset').addEventListener('click',resetView);
      $('speedUp').addEventListener('click',()=>setSpeed(speed+0.1));
      $('speedDown').addEventListener('click',()=>setSpeed(speed-0.1));
      const bar=$('progressBar');
      function seekAt(cy){ const r=bar.getBoundingClientRect(); const ratio=Math.min(1,Math.max(0,(r.bottom-cy)/r.height)); if(hasAudio()&&audio.duration)audio.currentTime=ratio*audio.duration; }
      let dg=false;
      bar.addEventListener('pointerdown',e=>{e.stopPropagation();dg=true;seekAt(e.clientY);});
      window.addEventListener('pointermove',e=>{if(dg)seekAt(e.clientY);});
      window.addEventListener('pointerup',()=>dg=false);
      $('setA').addEventListener('click',()=>{ if(!hasAudio())return; loopA=audio.currentTime; if(loopB!=null&&loopB<=loopA)loopB=null; $('setA').classList.add('active'); refreshAB(); toast('起点A '+fmt(loopA),'ok'); });
      $('setB').addEventListener('click',()=>{ if(!hasAudio())return; const t=audio.currentTime; if(loopA==null){toast('请先设A','err');return;} if(t<=loopA){toast('B需晚于A','err');return;} loopB=t; $('setB').classList.add('active'); refreshAB(); toast('终点B '+fmt(loopB),'ok'); });
      $('clearAB').addEventListener('click',()=>{ loopA=loopB=null; $('setA').classList.remove('active'); $('setB').classList.remove('active'); refreshAB(); toast('已取消循环','ok'); });
      ['mousemove','touchstart','click','keydown','wheel'].forEach(ev=>document.addEventListener(ev,onActivity,{passive:true}));
      document.addEventListener('keydown',e=>{
        const tag=(document.activeElement&&document.activeElement.tagName||'').toLowerCase();
        if(['input','textarea','select'].includes(tag))return;
        if(e.code==='Space'){e.preventDefault();togglePlay();}
        else if(e.code==='ArrowRight'){e.preventDefault(); if(!seekBy(SEEK_STEP_SECONDS))nextPage(true);}
        else if(e.code==='ArrowLeft'){e.preventDefault(); if(!seekBy(-SEEK_STEP_SECONDS))prevPage(true);}
        else if(e.key==='f'||e.key==='F')toggleFs();
        else if(e.key==='0')resetView();
      });
    }

    const _backBtn=$('backBtn');
    if(_backBtn){_backBtn.addEventListener('click',(e)=>{e.preventDefault();goHome();});}

    init();
  </script>
</body>
</html>
