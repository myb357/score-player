<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>登录 · 谱子播放器</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <script>
    /* ---- 方案B: offline/web dual-mode runtime ---- */
    var IS_FILE = location.protocol === 'file:';
    var API_BASE = IS_FILE ? 'https://score-player.onrender.com' : '';
    function authToken() {
      try {
        var token = '';
        if (window.AndroidBridge && typeof window.AndroidBridge.getToken === 'function') {
          token = window.AndroidBridge.getToken() || '';
        }
        return token || localStorage.getItem('auth_token') || '';
      } catch (e) { return ''; }
    }
    function apiFetch(path, opts) {
      opts = opts || {};
      var url = /^https?:/i.test(path) ? path : (API_BASE + path);
      var headers = new Headers(opts.headers || {});
      var t = authToken();
      if (t) headers.set('Authorization', 'Bearer ' + t);
      opts.headers = headers;
      return fetch(url, opts);
    }
    function goHome() { location.href = IS_FILE ? 'home.html' : '/'; }
    if (IS_FILE) {
      var _cssLink = document.createElement('link');
      _cssLink.rel = 'stylesheet'; _cssLink.href = 'style.css';
      document.head.appendChild(_cssLink);
    }
  </script>
</head>
<body>
  <div class="auth-wrap">
    <form class="panel auth-card" id="loginForm">
      <div class="auth-logo">🎼</div>
      <h1>谱子播放器</h1>
      <div class="sub">请登录以继续</div>
      <div class="form-row">
        <label class="field-label" for="username">用户名</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="请输入用户名" required />
      </div>
      <div class="form-row">
        <label class="field-label" for="password">密码</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="请输入密码" required />
      </div>
      <button class="btn btn-primary" type="submit" id="submitBtn" style="width:100%; justify-content:center; margin-top:6px;">登 录</button>
      <div class="error-msg" id="err"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const err = document.getElementById('err');
    const btn = document.getElementById('submitBtn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      try {
        const res = await apiFetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        if (res.ok) {
          const data = await res.json().catch(() => ({}));
          if (data.token) {
            try {
              localStorage.setItem('auth_token', data.token);
              if (window.AndroidBridge && typeof window.AndroidBridge.saveToken === 'function') {
                window.AndroidBridge.saveToken(data.token);
              }
            } catch (e) {}
          }
          goHome();
          return;
        }
        const data = await res.json().catch(() => ({}));
        err.textContent = data.detail || '登录失败';
      } catch (e2) {
        err.textContent = '网络错误，请重试';
      }
      btn.disabled = false;
      btn.textContent = '登 录';
    });
  </script>
</body>
</html>
