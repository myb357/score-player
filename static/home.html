<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>我的谱子</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#7c5cff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="谱子播放器">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    .modal-overlay { position: fixed; inset: 0; background: rgba(5,6,12,.66); backdrop-filter: blur(4px); z-index: 200; display: grid; place-items: center; padding: 20px; }
    .modal-card { width: 100%; max-width: 420px; padding: 26px; }
    .modal-card h2 { margin: 0 0 6px; font-size: 20px; }
    .modal-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
    .modal-card .form-row { margin-bottom: 14px; }
    .sc-owner { font-size: 12px; color: var(--muted); margin: -4px 0 10px; position: relative; }
    .sc-actions { position: absolute; top: 12px; right: 12px; z-index: 3; display: flex; gap: 8px; opacity: 0; }
    .score-card:hover .sc-actions { opacity: 1; }
    /* neutralize the standalone absolute positioning of .sc-del from style.css so buttons sit side by side */
    .score-card .sc-actions .sc-del { position: static; top: auto; right: auto; opacity: 1; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="logo">🎼</span> 谱子播放器</div>
    <div class="topbar-actions">
      <button class="btn btn-ghost" id="importBtn">导入谱子</button>
      <input type="file" id="importInput" accept=".zip,application/zip" hidden />
      <a class="btn btn-primary" href="/new">＋ 新建谱子</a>
      <div class="settings-menu" id="settingsMenu">
        <button class="btn btn-ghost btn-icon settings-toggle" id="settingsBtn" type="button" aria-label="设置" aria-haspopup="true" aria-expanded="false">⚙</button>
        <div class="settings-dropdown" id="settingsDropdown" role="menu">
          <a class="settings-item" href="/users" id="usersBtn" role="menuitem" style="display:none;">用户管理</a>
          <button class="settings-item" id="pwdBtn" type="button" role="menuitem">修改密码</button>
          <a class="settings-item" href="/download/android" id="downloadAndroidBtn" role="menuitem">下载 Android App</a>
          <button class="settings-item" id="clearCacheBtn" type="button" role="menuitem">清除缓存</button>
          <button class="settings-item danger" id="logoutBtn" type="button" role="menuitem">退出登录</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="page-head">
      <h1>我的谱子</h1>
      <button class="btn btn-ghost" id="batchToggleBtn" type="button" style="display:none;">批量选择</button>
    </div>
    <div class="batch-toolbar panel" id="batchToolbar" style="display:none;">
      <div class="batch-count" id="batchCount">已选 0 个</div>
      <div class="batch-actions">
        <button class="btn btn-sm" id="batchSelectAll" type="button">全选</button>
        <button class="btn btn-sm" id="batchClear" type="button">取消全选</button>
        <button class="btn btn-sm" id="batchExport" type="button">批量导出</button>
        <button class="btn btn-danger btn-sm" id="batchDelete" type="button">批量删除</button>
        <button class="btn btn-ghost btn-sm" id="batchCancel" type="button">取消</button>
      </div>
    </div>
    <div id="content">
      <div class="empty"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- 修改密码 modal -->
  <div class="modal-overlay" id="pwdModal" style="display:none;">
    <div class="panel modal-card">
      <h2>修改密码</h2>
      <div class="sub">修改后请使用新密码登录</div>
      <div class="form-row">
        <label class="field-label" for="oldPwd">原密码</label>
        <input type="password" id="oldPwd" autocomplete="current-password" placeholder="请输入原密码" />
      </div>
      <div class="form-row">
        <label class="field-label" for="newPwd">新密码</label>
        <input type="password" id="newPwd" autocomplete="new-password" placeholder="至少 6 位" />
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" id="pwdCancel">取消</button>
        <button class="btn btn-primary" id="pwdSave">确认修改</button>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>

  <script>
    function toast(msg, type) {
      const w = document.getElementById('toasts');
      const t = document.createElement('div');
      t.className = 'toast ' + (type || '');
      t.textContent = msg;
      w.appendChild(t);
      setTimeout(() => t.remove(), 2600);
    }

    const settingsMenu = document.getElementById('settingsMenu');
    const settingsBtn = document.getElementById('settingsBtn');
    function closeSettingsMenu() {
      settingsMenu.classList.remove('open');
      settingsBtn.setAttribute('aria-expanded', 'false');
    }
    function toggleSettingsMenu() {
      const willOpen = !settingsMenu.classList.contains('open');
      settingsMenu.classList.toggle('open', willOpen);
      settingsBtn.setAttribute('aria-expanded', String(willOpen));
      if (willOpen) updateCacheSizeLabel();
    }
    settingsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleSettingsMenu();
    });
    document.addEventListener('click', (e) => {
      if (!settingsMenu.contains(e.target)) closeSettingsMenu();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeSettingsMenu();
    });

    const SCORE_LIST_CACHE_KEY = 'score-player:score-list-cache';
    const SCORE_LIST_CACHE_TTL = 60 * 60 * 1000;
    const SCORE_CACHE_NAME = 'score-player-score-assets-v1';

    function readScoreListCache() {
      try {
        const cached = JSON.parse(localStorage.getItem(SCORE_LIST_CACHE_KEY) || 'null');
        if (!cached || !Array.isArray(cached.scores) || Date.now() - cached.cachedAt > SCORE_LIST_CACHE_TTL) return null;
        return cached;
      } catch (e) { return null; }
    }

    function writeScoreListCache(data) {
      try {
        localStorage.setItem(SCORE_LIST_CACHE_KEY, JSON.stringify({
          cachedAt: Date.now(),
          scores: data.scores || [],
          role: data.role || currentRole,
        }));
      } catch (e) { /* ignore quota/private mode errors */ }
    }

    const clearCacheBtn = document.getElementById('clearCacheBtn');
    let cacheSizeRequestId = 0;

    function byteLength(str) {
      return new Blob([str == null ? '' : String(str)]).size;
    }

    function formatCacheSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    async function getLocalStorageSize() {
      let total = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key) continue;
        total += byteLength(key);
        total += byteLength(localStorage.getItem(key));
      }
      return total;
    }

    async function getCacheApiSize() {
      if (!('caches' in window)) return 0;
      let total = 0;
      const cacheNames = await caches.keys();
      for (const cacheName of cacheNames) {
        const cache = await caches.open(cacheName);
        const requests = await cache.keys();
        for (const request of requests) {
          const response = await cache.match(request);
          if (!response) continue;
          const contentLength = response.headers.get('Content-Length');
          const parsedLength = contentLength ? Number(contentLength) : NaN;
          if (Number.isFinite(parsedLength) && parsedLength >= 0) {
            total += parsedLength;
          } else {
            total += (await response.clone().blob()).size;
          }
        }
      }
      return total;
    }

    async function updateCacheSizeLabel() {
      const requestId = ++cacheSizeRequestId;
      clearCacheBtn.textContent = '清除缓存 (计算中...)';
      try {
        const totalBytes = await getLocalStorageSize() + await getCacheApiSize();
        if (requestId === cacheSizeRequestId) {
          clearCacheBtn.textContent = '清除缓存 (' + formatCacheSize(totalBytes) + ')';
        }
      } catch (e) {
        if (requestId === cacheSizeRequestId) clearCacheBtn.textContent = '清除缓存 (计算失败)';
      }
    }

    async function clearAllLocalCaches() {
      localStorage.removeItem(SCORE_LIST_CACHE_KEY);
      Object.keys(localStorage).forEach(key => {
        if (key.indexOf('score-player:score-detail:') === 0 || key.indexOf('score-player:view-mode:') === 0) {
          localStorage.removeItem(key);
        }
      });
      if ('caches' in window) {
        await caches.delete(SCORE_CACHE_NAME);
      }
    }

    clearCacheBtn.addEventListener('click', async () => {
      closeSettingsMenu();
      const btn = document.getElementById('clearCacheBtn');
      btn.disabled = true;
      try {
        await clearAllLocalCaches();
        toast('本地缓存已清除', 'ok');
        await load({ skipCache: true });
      } catch (e) {
        toast('清除缓存失败，请重试', 'err');
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      closeSettingsMenu();
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    });

    const importBtn = document.getElementById('importBtn');
    const importInput = document.getElementById('importInput');
    importBtn.addEventListener('click', () => importInput.click());
    importInput.addEventListener('change', async () => {
      const file = importInput.files && importInput.files[0];
      if (!file) return;
      if (!file.name.toLowerCase().endsWith('.zip')) { toast('请上传 ZIP 文件', 'err'); importInput.value = ''; return; }
      const fd = new FormData();
      fd.append('package', file, file.name);
      importBtn.disabled = true;
      importBtn.textContent = '导入中…';
      try {
        const res = await fetch('/api/scores/import', { method: 'POST', body: fd });
        if (res.status === 401) { window.location.href = '/login'; return; }
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.id) {
          toast('导入成功，正在打开谱子', 'ok');
          window.location.href = '/player/' + data.id;
        } else {
          toast(data.detail || '导入失败', 'err');
        }
      } catch (e) {
        toast('导入失败，请重试', 'err');
      }
      importBtn.disabled = false;
      importBtn.textContent = '导入谱子';
      importInput.value = '';
    });

    // ---------- session / role ----------
    let currentRole = 'user';
    async function loadSession() {
      try {
        const res = await fetch('/api/session');
        if (res.status === 401) { window.location.href = '/login'; return; }
        const data = await res.json();
        currentRole = data.role;
        if (data.role === 'superadmin') {
          document.getElementById('usersBtn').style.display = '';
        }
      } catch (e) { /* ignore, load() will handle 401 */ }
    }

    // ---------- change password modal ----------
    const pwdModal = document.getElementById('pwdModal');
    function openPwd() {
      document.getElementById('oldPwd').value = '';
      document.getElementById('newPwd').value = '';
      pwdModal.style.display = 'grid';
    }
    function closePwd() { pwdModal.style.display = 'none'; }
    document.getElementById('pwdBtn').addEventListener('click', () => {
      closeSettingsMenu();
      openPwd();
    });
    document.getElementById('pwdCancel').addEventListener('click', closePwd);
    pwdModal.addEventListener('click', e => { if (e.target === pwdModal) closePwd(); });
    document.getElementById('pwdSave').addEventListener('click', async () => {
      const oldPwd = document.getElementById('oldPwd').value;
      const newPwd = document.getElementById('newPwd').value;
      if (!oldPwd) { toast('请输入原密码', 'err'); return; }
      if (newPwd.length < 6) { toast('新密码至少 6 位', 'err'); return; }
      const btn = document.getElementById('pwdSave');
      btn.disabled = true;
      try {
        const res = await fetch('/api/me/password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ old_password: oldPwd, new_password: newPwd }),
        });
        if (res.status === 401) { window.location.href = '/login'; return; }
        const data = await res.json().catch(() => ({}));
        if (res.ok) { toast('密码已修改', 'ok'); closePwd(); }
        else toast(data.detail || '修改失败', 'err');
      } catch (e) {
        toast('网络错误，请重试', 'err');
      }
      btn.disabled = false;
    });

    function modeLabel(m) { return m === 'audio' ? '跟伴奏时间轴' : '独立倒计时'; }

    let scoreList = [];
    let batchMode = false;
    const selectedScores = new Set();
    const batchToggleBtn = document.getElementById('batchToggleBtn');
    const batchToolbar = document.getElementById('batchToolbar');
    const batchCount = document.getElementById('batchCount');
    const batchSelectAll = document.getElementById('batchSelectAll');
    const batchClear = document.getElementById('batchClear');
    const batchExport = document.getElementById('batchExport');
    const batchDelete = document.getElementById('batchDelete');
    const batchCancel = document.getElementById('batchCancel');

    function setBatchMode(enabled) {
      batchMode = enabled;
      if (!enabled) selectedScores.clear();
      batchToolbar.style.display = enabled ? 'flex' : 'none';
      batchToggleBtn.textContent = enabled ? '退出批量模式' : '批量选择';
      updateBatchUI();
      renderScores();
    }

    function updateBatchUI() {
      const count = selectedScores.size;
      batchCount.textContent = '已选 ' + count + ' 个';
      batchExport.disabled = count === 0;
      batchDelete.disabled = count === 0;
      batchClear.disabled = count === 0;
      batchSelectAll.disabled = scoreList.length === 0 || count === scoreList.length;
    }

    function toggleScoreSelection(id) {
      if (selectedScores.has(id)) selectedScores.delete(id);
      else selectedScores.add(id);
      updateBatchUI();
      renderScores();
    }

    batchToggleBtn.addEventListener('click', () => setBatchMode(!batchMode));
    batchCancel.addEventListener('click', () => setBatchMode(false));
    batchSelectAll.addEventListener('click', () => {
      scoreList.forEach(s => selectedScores.add(Number(s.id)));
      updateBatchUI();
      renderScores();
    });
    batchClear.addEventListener('click', () => {
      selectedScores.clear();
      updateBatchUI();
      renderScores();
    });
    batchExport.addEventListener('click', async () => {
      const ids = Array.from(selectedScores);
      if (ids.length === 0) return;
      batchExport.disabled = true;
      batchExport.textContent = '导出中…';
      try {
        const res = await fetch('/api/scores/batch-export', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids }),
        });
        if (res.status === 401) { window.location.href = '/login'; return; }
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          toast(data.detail || '批量导出失败', 'err');
          return;
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const contentDisposition = res.headers.get('Content-Disposition') || '';
        const match = contentDisposition.match(/filename\*=UTF-8''([^;]+)/i);
        a.download = match ? decodeURIComponent(match[1]) : 'scores_export.zip';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        toast('已开始下载', 'ok');
      } catch (e) {
        toast('批量导出失败，请重试', 'err');
      } finally {
        batchExport.textContent = '批量导出';
        updateBatchUI();
      }
    });
    batchDelete.addEventListener('click', async () => {
      const ids = Array.from(selectedScores);
      if (ids.length === 0) return;
      if (!confirm('确定删除选中的 ' + ids.length + ' 个谱子？此操作不可撤销')) return;
      batchDelete.disabled = true;
      batchDelete.textContent = '删除中…';
      try {
        const res = await fetch('/api/scores/batch-delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids }),
        });
        if (res.status === 401) { window.location.href = '/login'; return; }
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          toast('已删除 ' + (data.deleted || ids.length) + ' 个谱子', 'ok');
          selectedScores.clear();
          await load();
        } else {
          toast(data.detail || '批量删除失败', 'err');
        }
      } catch (e) {
        toast('批量删除失败，请重试', 'err');
      } finally {
        batchDelete.textContent = '批量删除';
        updateBatchUI();
      }
    });

    function renderScores() {
      const content = document.getElementById('content');
      if (scoreList.length === 0) {
        content.innerHTML = `<div class="empty">
            <div class="big">🎵</div>
            <div>还没有谱子，点击右上角「新建谱子」开始吧</div>
          </div>`;
        batchToggleBtn.style.display = 'none';
        batchMode = false;
        selectedScores.clear();
        batchToolbar.style.display = 'none';
        batchToggleBtn.textContent = '批量选择';
        updateBatchUI();
        return;
      }
      batchToggleBtn.style.display = '';
      const grid = document.createElement('div');
      grid.className = 'grid' + (batchMode ? ' batch-mode' : '');
      scoreList.forEach(s => {
        const id = Number(s.id);
        const checked = selectedScores.has(id);
        const card = document.createElement('div');
        card.className = 'panel score-card' + (checked ? ' selected' : '');
        const ownerHtml = (currentRole === 'superadmin' && s.owner)
          ? `<div class="sc-owner">创建者：<span class="badge">${escapeHtml(s.owner)}</span></div>` : '';
        const checkboxHtml = batchMode
          ? `<label class="batch-check" aria-label="选择 ${escapeHtml(s.name)}"><input type="checkbox" ${checked ? 'checked' : ''} /></label>` : '';
        card.innerHTML = `
            ${checkboxHtml}
            <div class="sc-actions">
              <button class="btn btn-sm sc-export" data-id="${id}">导出</button>
              <button class="btn btn-sm sc-edit" data-id="${id}">编辑</button>
              <button class="btn btn-danger btn-sm sc-del" data-id="${id}">删除</button>
            </div>
            <div class="sc-name">${escapeHtml(s.name)}</div>
            ${ownerHtml}
            <div class="sc-meta">
              <span class="badge accent">${modeLabel(s.mode)}</span>
              <span class="badge">${s.page_count} 页</span>
              ${s.has_audio ? '<span class="badge">含伴奏</span>' : ''}
            </div>
            <div class="sc-time">创建于 ${s.created_at_text}</div>`;
        card.addEventListener('click', (e) => {
          if (e.target.closest('.sc-actions')) return;
          if (batchMode) {
            e.preventDefault();
            toggleScoreSelection(id);
            return;
          }
          window.location.href = '/player/' + id;
        });
        const check = card.querySelector('.batch-check input');
        if (check) {
          check.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleScoreSelection(id);
          });
        }
        card.querySelector('.sc-export').addEventListener('click', (e) => {
          e.stopPropagation();
          window.location.href = '/api/scores/' + id + '/export';
        });
        card.querySelector('.sc-edit').addEventListener('click', (e) => {
          e.stopPropagation();
          window.location.href = '/new?edit=' + id;
        });
        card.querySelector('.sc-del').addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('确定删除《' + s.name + '》？此操作不可撤销')) return;
          const r = await fetch('/api/scores/' + id, { method: 'DELETE' });
          if (r.ok) {
            localStorage.removeItem(SCORE_LIST_CACHE_KEY);
            if ('caches' in window) {
              const cache = await caches.open(SCORE_CACHE_NAME);
              await cache.delete('/api/scores/' + id);
            }
            localStorage.removeItem('score-player:score-detail:' + id);
            toast('已删除', 'ok');
            load({ skipCache: true });
          }
          else toast('删除失败', 'err');
        });
        grid.appendChild(card);
      });
      content.innerHTML = '';
      content.appendChild(grid);
      updateBatchUI();
    }

    async function load(options) {
      const content = document.getElementById('content');
      const opts = options || {};
      const cached = opts.skipCache ? null : readScoreListCache();
      if (cached) {
        scoreList = cached.scores;
        if (cached.role === 'superadmin') {
          currentRole = 'superadmin';
          document.getElementById('usersBtn').style.display = '';
        }
        renderScores();
      }
      try {
        const res = await fetch('/api/scores', { cache: 'no-store' });
        if (res.status === 401) { window.location.href = '/login'; return; }
        const data = await res.json();
        writeScoreListCache(data);
        scoreList = data.scores || [];
        selectedScores.forEach(id => {
          if (!scoreList.some(s => Number(s.id) === id)) selectedScores.delete(id);
        });
        if (data.role === 'superadmin') {
          currentRole = 'superadmin';
          document.getElementById('usersBtn').style.display = '';
        }
        renderScores();
      } catch (e) {
        if (!cached) content.innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
        else toast('已显示缓存，后台更新失败', 'err');
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    loadSession();
    load();
  </script>
</body>
</html>
