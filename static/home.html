<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>我的谱子</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#7c5cff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="谱子播放器">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/style.css" />
  <script>
    /* ---- 方案B: offline/web dual-mode runtime ---- */
    var IS_FILE = location.protocol === 'file:';
    /* ---- 服务端点故障切换：Cloudflare Tunnel 优先 + Tailscale 备用 + Render 最终兜底（仅离线 APK/file:// 生效）---- */
    var API_PRIMARY = 'https://scoreplayer-myb.top';   /* Cloudflare Tunnel（主）*/
    var API_FALLBACK = 'https://istoreos.tail11098d.ts.net';   /* Tailscale 软路由（备）*/
    var API_FALLBACK2 = 'https://score-player.onrender.com';   /* Render（最终兜底）*/
    var API_PROBE_TIMEOUT = 4000;   /* Render 健康探测超时(ms)，3-5s */
    var API_CHOICE_TTL = 60000;     /* 端点选择缓存(ms)，跨页面复用，避免每次重探 */
    /* Web 模式(同源)保持相对路径 ''；离线 APK 默认先用 Cloudflare Tunnel 主地址 */
    var API_BASE = IS_FILE ? API_PRIMARY : '';
    function __epToast(msg) {
      try {
        if (!IS_FILE) return;
        var d = document.createElement('div');
        d.textContent = msg;
        d.style.cssText = 'position:fixed;left:50%;bottom:48px;transform:translateX(-50%);'
          + 'z-index:99999;background:rgba(40,40,48,.92);color:#fff;padding:10px 16px;'
          + 'border-radius:20px;font-size:13px;max-width:80%;text-align:center;'
          + 'box-shadow:0 4px 16px rgba(0,0,0,.25);pointer-events:none;';
        (document.body || document.documentElement).appendChild(d);
        setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 2600);
      } catch (e) {}
    }
    function __epSetBase(base, reason) {
      if (API_BASE === base) return;
      API_BASE = base;
      try { sessionStorage.setItem('api_base_choice', base + '|' + Date.now()); } catch (e) {}
      if (base === API_FALLBACK) __epToast('主服务不可用，已切换到 Tailscale 软路由' + (reason || ''));
      if (base === API_FALLBACK2) __epToast('主服务和 Tailscale 均不可用，已切换到 Render 最终兜底' + (reason || ''));
    }
    function __epProbe(url, timeout) {
      if (typeof AbortController === 'undefined') return fetch(url, { cache: 'no-store' });
      var ctrl = new AbortController();
      var t = setTimeout(function () { ctrl.abort(); }, timeout);
      return fetch(url, { cache: 'no-store', signal: ctrl.signal })
        .finally(function () { clearTimeout(t); });
    }
    /* 端点选择：探测 Render /api/v1/ping；成功用 Render，超时/失败切软路由。
       结果缓存在 sessionStorage，TTL 内跨页面直接复用。返回 Promise。 */
    var __apiBaseReady = (function () {
      if (!IS_FILE) return Promise.resolve('');
      try {
        var cached = sessionStorage.getItem('api_base_choice');
        if (cached) {
          var p = cached.split('|');
          if (p[0] && (Date.now() - (parseInt(p[1], 10) || 0)) < API_CHOICE_TTL) {
            API_BASE = p[0]; return Promise.resolve(API_BASE);
          }
        }
      } catch (e) {}
      return __epProbe(API_PRIMARY + '/api/v1/ping', API_PROBE_TIMEOUT)
        .then(function (r) {
          if (r && r.ok) { __epSetBase(API_PRIMARY); return API_PRIMARY; }
          return __epProbe(API_FALLBACK + '/api/v1/ping', API_PROBE_TIMEOUT)
            .then(function (r2) {
              if (r2 && r2.ok) { __epSetBase(API_FALLBACK); return API_FALLBACK; }
              __epSetBase(API_FALLBACK2); return API_FALLBACK2;
            })
            .catch(function () { __epSetBase(API_FALLBACK2); return API_FALLBACK2; });
        })
        .catch(function () {
          return __epProbe(API_FALLBACK + '/api/v1/ping', API_PROBE_TIMEOUT)
            .then(function (r2) {
              if (r2 && r2.ok) { __epSetBase(API_FALLBACK); return API_FALLBACK; }
              __epSetBase(API_FALLBACK2); return API_FALLBACK2;
            })
            .catch(function () { __epSetBase(API_FALLBACK2); return API_FALLBACK2; });
        });
    })();
    function __epRebase(url) {
      if (!IS_FILE || !url) return url;
      if (url.indexOf(API_PRIMARY) === 0) return API_BASE + url.slice(API_PRIMARY.length);
      if (url.indexOf(API_FALLBACK) === 0) return API_BASE + url.slice(API_FALLBACK.length);
      if (url.indexOf(API_FALLBACK2) === 0) return API_BASE + url.slice(API_FALLBACK2.length);
      return url;
    }
    /* 统一网络出口：等待端点就绪→按当前 base 请求；网络层硬失败则切另一端点重试一次。
       注意：不对正常请求加超时，避免中断上传/转码等长耗时请求。 */
    window.__epFetch = function (url, opts) {
      return __apiBaseReady.then(function () {
        var u = __epRebase(url);
        var switchable = IS_FILE && u.indexOf(API_BASE) === 0;
        return fetch(u, opts).catch(function (err) {
          if (!switchable) throw err;
          var other = (API_BASE === API_PRIMARY) ? API_FALLBACK : API_PRIMARY;
          __epSetBase(other, '（网络异常）');
          return fetch(__epRebase(u), opts);
        });
      });
    };
    function safeStorageGet(key) {
      try { return window.localStorage ? (localStorage.getItem(key) || '') : ''; } catch (e) { return ''; }
    }
    function safeStorageSet(key, value) {
      try { if (window.localStorage) localStorage.setItem(key, value); } catch (e) {}
    }
    function safeStorageRemove(key) {
      try { if (window.localStorage) localStorage.removeItem(key); } catch (e) {}
    }
    function safeStorageKeys() {
      try { return window.localStorage ? Object.keys(localStorage) : []; } catch (e) { return []; }
    }
    function authToken() {
      try {
        if (window.AndroidBridge && typeof window.AndroidBridge.getToken === 'function') {
          var token = window.AndroidBridge.getToken() || '';
          if (token) return token;
        }
      } catch (e) {}
      return safeStorageGet('auth_token');
    }
    function clearAuthToken() {
      safeStorageRemove('auth_token');
      try {
        if (window.AndroidBridge && typeof window.AndroidBridge.clearToken === 'function') {
          window.AndroidBridge.clearToken();
        }
      } catch (e) {}
    }
    function mediaUrl(u) { return (u && u.charAt(0) === '/') ? (API_BASE + u) : u; }
    function apiFetch(path, opts) {
      opts = opts || {};
      var url = /^https?:/i.test(path) ? path : (API_BASE + path);
      var headers = new Headers(opts.headers || {});
      var t = authToken();
      if (t) headers.set('Authorization', 'Bearer ' + t);
      opts.headers = headers;
      return window.__epFetch(url, opts);
    }
    function goHome() { location.href = IS_FILE ? 'home.html' : '/'; }
    function goLogin() { location.href = IS_FILE ? 'login.html' : '/login'; }
    function goUsers() { location.href = IS_FILE ? 'users.html' : '/users'; }
    function goDownloads() { location.href = IS_FILE ? 'downloads.html' : '/downloads'; }
    function goPlayer(id) { location.href = IS_FILE ? ('player.html?id=' + id) : ('/player/' + id); }
    function goNew(editId) { location.href = (IS_FILE ? 'new.html' : '/new') + (editId ? '?edit=' + editId : ''); }
    if (IS_FILE) {
      var _cssLink = document.createElement('link');
      _cssLink.rel = 'stylesheet'; _cssLink.href = 'style.css';
      document.head.appendChild(_cssLink);
    }
  </script>
  <script>
    /* ============================================================
       离线下载共享模块 (ScoreDB) —— home / player / downloads 三处保持完全一致
       使用 IndexedDB 存储谱子元数据 + 图片 Blob + 音频 Blob。
       依赖上方 runtime 中的 apiFetch / mediaUrl。
       ============================================================ */
    var ScoreDB = (function () {
      var DB_NAME = 'score-player-offline';
      var DB_VERSION = 2;
      var STORE_META = 'meta';    // keyPath: id  -> {id,name,mode,page_count,has_audio,audio_path,pages[],cover_path,size,downloaded_at}
      var STORE_BLOBS = 'blobs';  // keyPath: path -> {path,scoreId,type,blob}
      var _dbPromise = null;
      var OPEN_TIMEOUT_MS = 3000;

      function withTimeout(promise, ms, message) {
        var timer = null;
        var timeout = new Promise(function (_, reject) {
          timer = setTimeout(function () { reject(new Error(message || 'IndexedDB 初始化超时')); }, ms);
        });
        return Promise.race([promise, timeout]).then(function (value) {
          clearTimeout(timer);
          return value;
        }, function (err) {
          clearTimeout(timer);
          throw err;
        });
      }

      function open() {
        if (_dbPromise) return _dbPromise;
        _dbPromise = withTimeout(new Promise(function (resolve, reject) {
          if (!('indexedDB' in window)) { reject(new Error('当前环境不支持 IndexedDB')); return; }
          var req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = function (e) {
            var db = e.target.result;
            if (db.objectStoreNames.contains(STORE_META)) db.deleteObjectStore(STORE_META);
            if (db.objectStoreNames.contains(STORE_BLOBS)) db.deleteObjectStore(STORE_BLOBS);
            db.createObjectStore(STORE_META, { keyPath: 'id' });
            var s = db.createObjectStore(STORE_BLOBS, { keyPath: 'path' });
            s.createIndex('scoreId', 'scoreId', { unique: false });
          };
          req.onsuccess = function () { resolve(req.result); };
          req.onerror = function () { reject(req.error); };
        }), OPEN_TIMEOUT_MS, 'IndexedDB 初始化超时').catch(function (err) {
          _dbPromise = null;
          throw err;
        });
        return _dbPromise;
      }

      function reqPromise(request) {
        return new Promise(function (resolve, reject) {
          request.onsuccess = function () { resolve(request.result); };
          request.onerror = function () { reject(request.error); };
        });
      }

      function getMeta(id) {
        return open().then(function (db) {
          return reqPromise(db.transaction(STORE_META, 'readonly').objectStore(STORE_META).get(Number(id)));
        });
      }

      function getAllMeta() {
        return open().then(function (db) {
          return reqPromise(db.transaction(STORE_META, 'readonly').objectStore(STORE_META).getAll());
        }).then(function (list) { return list || []; });
      }

      function getDownloadedIds() {
        return getAllMeta().then(function (list) {
          return list.map(function (m) { return Number(m.id); });
        });
      }

      function isDownloaded(id) {
        return getMeta(id).then(function (m) { return !!m; }).catch(function () { return false; });
      }

      function getBlob(path) {
        return open().then(function (db) {
          return reqPromise(db.transaction(STORE_BLOBS, 'readonly').objectStore(STORE_BLOBS).get(path));
        }).then(function (rec) { return rec ? rec.blob : null; });
      }

      function localAssetUrl(path) {
        if (!path) return Promise.resolve(null);
        return getBlob(path).then(function (blob) { return blob ? URL.createObjectURL(blob) : null; }).catch(function () { return null; });
      }

      function saveScore(meta, blobs) {
        return open().then(function (db) {
          return new Promise(function (resolve, reject) {
            var t = db.transaction([STORE_META, STORE_BLOBS], 'readwrite');
            t.oncomplete = function () { resolve(true); };
            t.onerror = function () { reject(t.error); };
            t.onabort = function () { reject(t.error); };
            t.objectStore(STORE_META).put(meta);
            var bs = t.objectStore(STORE_BLOBS);
            (blobs || []).forEach(function (b) { bs.put(b); });
          });
        });
      }

      function deleteScore(id) {
        id = Number(id);
        return open().then(function (db) {
          return new Promise(function (resolve, reject) {
            var t = db.transaction([STORE_META, STORE_BLOBS], 'readwrite');
            t.oncomplete = function () { resolve(true); };
            t.onerror = function () { reject(t.error); };
            t.onabort = function () { reject(t.error); };
            t.objectStore(STORE_META).delete(id);
            var curReq = t.objectStore(STORE_BLOBS).index('scoreId').openCursor(IDBKeyRange.only(id));
            curReq.onsuccess = function (e) {
              var cursor = e.target.result;
              if (cursor) { cursor.delete(); cursor.continue(); }
            };
          });
        });
      }

      // 下载单个谱子的全部资源到 IndexedDB。onProgress(done,total) 可选。
      function downloadScore(id, onProgress) {
        id = Number(id);
        return apiFetch('/api/scores/' + id, { cache: 'no-store' }).then(function (res) {
          if (res.status === 401) throw new Error('登录已失效');
          if (!res.ok) throw new Error('获取谱子信息失败');
          return res.json();
        }).then(function (detail) {
          var pages = detail.pages || [];
          var total = pages.length + (detail.audio_url ? 1 : 0);
          var done = 0;
          var blobs = [];
          var tasks = [];
          function tick() { done++; if (typeof onProgress === 'function') onProgress(done, total); }
          function fetchBlob(url) {
            return fetch(mediaUrl(url), { cache: 'no-store' }).then(function (r) {
              if (!r.ok) throw new Error('资源下载失败: ' + url);
              return r.blob();
            });
          }
          pages.forEach(function (p) {
            tasks.push(fetchBlob(p.image_url).then(function (blob) {
              blobs.push({ path: p.image_url, scoreId: id, type: 'image', blob: blob });
              tick();
            }));
          });
          if (detail.audio_url) {
            tasks.push(fetchBlob(detail.audio_url).then(function (blob) {
              blobs.push({ path: detail.audio_url, scoreId: id, type: 'audio', blob: blob });
              tick();
            }));
          }
          return Promise.all(tasks).then(function () {
            var size = blobs.reduce(function (acc, b) { return acc + (b.blob ? b.blob.size : 0); }, 0);
            var meta = {
              id: id,
              name: detail.name,
              mode: detail.mode,
              page_count: pages.length,
              has_audio: !!detail.audio_url,
              audio_path: detail.audio_url || '',
              pages: pages.map(function (p) { return { index: p.index, image_path: p.image_url, turn_seconds: p.turn_seconds }; }),
              cover_path: pages.length ? pages[0].image_url : '',
              size: size,
              downloaded_at: Date.now()
            };
            return saveScore(meta, blobs).then(function () { return meta; });
          });
        });
      }

      function formatSize(bytes) {
        bytes = bytes || 0;
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      }

      return {
        open: open,
        getMeta: getMeta,
        getAllMeta: getAllMeta,
        getDownloadedIds: getDownloadedIds,
        isDownloaded: isDownloaded,
        getBlob: getBlob,
        localAssetUrl: localAssetUrl,
        saveScore: saveScore,
        deleteScore: deleteScore,
        downloadScore: downloadScore,
        formatSize: formatSize
      };
    })();
  </script>

    .modal-overlay { position: fixed; inset: 0; background: rgba(5,6,12,.66); backdrop-filter: blur(4px); z-index: 200; display: grid; place-items: center; padding: 20px; }

    .badge.dl-badge::before { content: '⤓'; margin-right: 4px; font-weight: 800; }

    .job-card.job-done:hover { background: rgba(52,211,153,.08); }
    .job-card.job-error { border-color: rgba(248,113,113,.4); }
    .job-icon { font-size: 22px; line-height: 1; flex: 0 0 auto; }
    .job-main { flex: 1 1 auto; min-width: 0; }
    .job-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .job-status-text { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .job-status-text.err { color: #f87171; }
    .job-progress { margin-top: 8px; height: 6px; border-radius: 6px; background: rgba(124,92,255,.15); overflow: hidden; }
    .job-progress > i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg,#7c5cff,#22d3ee); transition: width .4s ease; }
    .job-side { flex: 0 0 auto; display: flex; gap: 8px; align-items: center; }
    .spin-inline { display: inline-block; width: 15px; height: 15px; border: 2px solid rgba(124,92,255,.3); border-top-color: #7c5cff; border-radius: 50%; animation: jobspin .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
    @keyframes jobspin { to { transform: rotate(360deg); } }
  </style>

  <script>

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });

  <script>
    function toast(msg, type) {
      const w = document.getElementById('toasts');
      const t = document.createElement('div');
      t.className = 'toast ' + (type || '');
      t.textContent = msg;
      w.appendChild(t);
      setTimeout(() => t.remove(), 2600);
    }

    const CURRENT_APP_VERSION = '1.3.8';
    function compareVersions(remote, current) {
      const remoteParts = String(remote || '').split('.');
      const currentParts = String(current || '').split('.');
      const length = Math.max(remoteParts.length, currentParts.length);
      for (let i = 0; i < length; i++) {
        const remoteValue = parseInt((remoteParts[i] || '0').replace(/[^0-9]/g, ''), 10) || 0;
        const currentValue = parseInt((currentParts[i] || '0').replace(/[^0-9]/g, ''), 10) || 0;
        if (remoteValue !== currentValue) return remoteValue - currentValue;
      }
      return 0;
    }

      const latestVersion = String(data.version || '').trim();
      if (!latestVersion) throw new Error('missing version');
      if (compareVersions(latestVersion, CURRENT_APP_VERSION) > 0) {
        const shouldUpdate = confirm('发现新版本 v' + latestVersion + '，是否立即更新？');
        if (shouldUpdate) window.location.href = data.apk_url || (API_BASE + '/download/android');
      } else {

    }

    function byteLength(str) {
      return new Blob([str == null ? '' : String(str)]).size;
    }

    function formatCacheSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    async function getLocalStorageSize() {
      let total = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key) continue;
        total += byteLength(key);
        total += byteLength(localStorage.getItem(key));
      }
      return total;
    }

    async function getCacheApiSize() {
      if (!('caches' in window)) return 0;
      let total = 0;
      const cacheNames = await caches.keys();
      for (const cacheName of cacheNames) {
        const cache = await caches.open(cacheName);
        const requests = await cache.keys();
        for (const request of requests) {
          const response = await cache.match(request);
          if (!response) continue;
          const contentLength = response.headers.get('Content-Length');
          const parsedLength = contentLength ? Number(contentLength) : NaN;
          if (Number.isFinite(parsedLength) && parsedLength >= 0) {
            total += parsedLength;
          } else {
            total += (await response.clone().blob()).size;
          }
        }
      }
      return total;
    }

    async function updateCacheSizeLabel() {
      const requestId = ++cacheSizeRequestId;
      clearCacheBtn.textContent = '清除缓存 (计算中...)';
      try {
        const totalBytes = await getLocalStorageSize() + await getCacheApiSize();
        if (requestId === cacheSizeRequestId) {
          clearCacheBtn.textContent = '清除缓存 (' + formatCacheSize(totalBytes) + ')';
        }
      } catch (e) {
        if (requestId === cacheSizeRequestId) clearCacheBtn.textContent = '清除缓存 (计算失败)';
      }
    }

    async function load(options) {
      const content = document.getElementById('content');
      const opts = options || {};
      const downloadedRefresh = refreshDownloadedIds();
      const cached = opts.skipCache ? null : readScoreListCache();
      if (!cached) renderSkeleton();
      if (cached) {
        scoreList = cached.scores;
        if (cached.role === 'superadmin') {
          currentRole = 'superadmin';
          document.getElementById('usersBtn').style.display = '';
        }
        renderScores();
      }
      try {
        const res = await apiFetch('/api/scores', { cache: 'no-store' });
        if (res.status === 401) { goLogin(); return; }
        const data = await res.json();
        writeScoreListCache(data);
        scoreList = data.scores || [];
        selectedScores.forEach(id => {
          if (!scoreList.some(s => Number(s.id) === id)) selectedScores.delete(id);
        });
        if (data.role === 'superadmin') {
          currentRole = 'superadmin';
          document.getElementById('usersBtn').style.display = '';
        }
        renderScores();
        downloadedRefresh.then(renderScores).catch(() => {});
      } catch (e) {
        const offlineScores = await loadDownloadedScoreList();
        if (!cached && offlineScores.length) {
          scoreList = offlineScores;
          offlineScores.forEach(s => downloadedIds.add(Number(s.id)));
          renderScores();
          toast('当前离线，已显示已下载谱子', 'ok');
        } else if (!cached) {
          content.innerHTML = '<div class="empty">当前离线，暂无可用缓存或已下载谱子</div>';
        } else {
          toast('已显示缓存，后台更新失败', 'err');
        }
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ---------- 制作中任务（异步谱子制作进度） ----------
    const JOB_RECENT_MS = 30 * 60 * 1000; // done/error 仅保留最近 30 分钟
    let jobPollTimer = null;
    let prevJobStatus = {};

    function jobCardHtml(j) {
      const title = escapeHtml(j.title || '未命名谱子');
      if (j.status === 'done') {
        return `<div class="job-card job-done" data-score-id="${j.score_id != null ? j.score_id : ''}">
            <div class="job-icon">✅</div>
            <div class="job-main">
              <div class="job-title">${title}</div>
              <div class="job-status-text">已完成 · 点击进入</div>
            </div>
            <div class="job-side"><button class="btn btn-sm">播放</button></div>
          </div>`;
      }
      if (j.status === 'error') {
        return `<div class="job-card job-error">
            <div class="job-icon">❌</div>
            <div class="job-main">
              <div class="job-title">${title}</div>
              <div class="job-status-text err">制作失败：${escapeHtml(j.error_msg || '未知错误')}</div>
            </div>
            <div class="job-side"><button class="btn btn-sm job-retry">重试</button></div>
          </div>`;
      }
      // pending / processing
      const prog = Math.max(0, Math.min(100, Number(j.progress) || 0));
      const statusText = j.status === 'processing' ? ('制作中… ' + prog + '%') : '排队中…';
      const bar = j.status === 'processing'
        ? `<div class="job-progress"><i style="width:${prog}%"></i></div>` : '';
      return `<div class="job-card job-active">
          <div class="job-icon">⏳</div>
          <div class="job-main">
            <div class="job-title">${title}</div>
            <div class="job-status-text"><span class="spin-inline"></span>${statusText}</div>
            ${bar}
          </div>
        </div>`;
    }

    function renderJobs(jobs) {
      const section = document.getElementById('jobsSection');
      const now = Date.now();
      const visible = (jobs || []).filter(j => {
        if (j.status === 'pending' || j.status === 'processing') return true;
        return (now - (Number(j.updated_at) || 0) * 1000) < JOB_RECENT_MS;
      });
      if (visible.length === 0) {
        section.style.display = 'none';
        section.innerHTML = '';
        return;
      }
      const activeCount = visible.filter(j => j.status === 'pending' || j.status === 'processing').length;
      section.innerHTML = `<div class="jobs-head">🛠 制作中任务
          <span class="jobs-count">${activeCount > 0 ? ('· ' + activeCount + ' 个进行中') : ''}</span>
        </div>
        <div class="jobs-list">${visible.map(jobCardHtml).join('')}</div>`;
      section.style.display = '';
      section.querySelectorAll('.job-card.job-done').forEach(el => {
        el.addEventListener('click', () => {
          const sid = el.getAttribute('data-score-id');
          if (sid) { saveHomeState(); goPlayer(sid); }
        });
      });
      section.querySelectorAll('.job-retry').forEach(el => {
        el.addEventListener('click', (e) => { e.stopPropagation(); goNew(); });
      });
    }

    function scheduleJobPoll(active) {
      if (jobPollTimer) { clearTimeout(jobPollTimer); jobPollTimer = null; }
      if (active) jobPollTimer = setTimeout(loadJobs, 3000);
    }

    async function loadJobs() {
      try {
        const res = await apiFetch('/api/scores/jobs?limit=10', { cache: 'no-store' });
        if (res.status === 401) { goLogin(); return; }
        if (!res.ok) return;
        const data = await res.json();
        const jobs = data.jobs || [];
        let anyJustDone = false;
        jobs.forEach(j => {
          const prev = prevJobStatus[j.job_id];
          if (prev && prev !== 'done' && j.status === 'done') anyJustDone = true;
        });
        prevJobStatus = {};
        jobs.forEach(j => { prevJobStatus[j.job_id] = j.status; });
        renderJobs(jobs);
        if (anyJustDone) load({ skipCache: true });
        const active = jobs.some(j => j.status === 'pending' || j.status === 'processing');
        scheduleJobPoll(active);
      } catch (e) { /* 网络波动忽略，下一次轮询重试 */ }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') loadJobs();
    });

    loadSession();
    load().then(restoreHomeState);
    loadJobs();
  </script>
</body>
</html>
